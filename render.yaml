services:
  - type: web
    name: control-financiero
    runtime: python
    plan: free  # En el plan gratis Render bloquea SMTP: los correos salen por la API HTTPS de Brevo
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: control-financiero-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: APP_PUBLIC_ORIGIN
        value: https://control-financiero-wrm5.onrender.com
      - key: WEBAUTHN_RP_ID
        value: control-financiero-wrm5.onrender.com
      - key: APP_TIMEZONE
        value: America/Caracas
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
  - type: cron
    name: control-financiero-recordatorios
    runtime: python
    plan: starter
    region: ohio
    schedule: "0 12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python send_payment_reminders.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: control-financiero-db
          property: connectionString
      - key: APP_PUBLIC_ORIGIN
        value: https://control-financiero-wrm5.onrender.com
      - key: WEBAUTHN_RP_ID
        value: control-financiero-wrm5.onrender.com
      - key: APP_TIMEZONE
        value: America/Caracas
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_SUB
        sync: false
databases:
  - name: control-financiero-db
    plan: basic-256mb
    databaseName: controlfinanciero
    user: controlfinanciero
    ipAllowList: []
    region: ohio