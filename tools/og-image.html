<!doctype html>
<!-- Imagen para compartir en redes (static/og-image.png, 1200×630). Para regenerarla:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=static/og-image.png tools/og-image.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0B6B4D;color:#fff;font-family:Figtree,system-ui,sans-serif;display:flex;align-items:center;padding:0 84px;gap:64px;position:relative}
body::after{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;background:#0F7D5A}
.txt{position:relative;z-index:1;flex:1}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.brand img{width:84px;height:84px;border-radius:22px}
.brand span{font:700 52px 'Bricolage Grotesque',sans-serif;letter-spacing:-1px}
h1{font:700 60px/1.08 'Bricolage Grotesque',sans-serif;letter-spacing:-1.5px;max-width:700px}
h1 em{font-style:normal;color:#BFF0D8}
.chips{display:flex;gap:12px;margin-top:40px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 18px;font-size:20px;font-weight:600;white-space:nowrap}
.card{position:relative;z-index:1;width:300px;background:#fff;color:#12211B;border-radius:28px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.card small{display:block;color:#46564E;font-size:18px;font-weight:600}
.card b{display:block;font:700 46px 'Bricolage Grotesque',sans-serif;margin:4px 0 18px}
.bar{height:14px;border-radius:7px;background:#E3F1EA;overflow:hidden;margin-bottom:18px}
.bar i{display:block;width:62%;height:100%;background:#0B6B4D}
.line{display:flex;justify-content:space-between;font-size:19px;padding:9px 0;border-top:1px solid #D5DDD7}
.line span:last-child{font-weight:600}
</style>
</head>
<body>
<div class="txt">
  <div class="brand"><img src="../static/icons/icon-512.png" alt=""><span>Quincena VE 🇻🇪</span></div>
  <h1>Sabe en qué se te va la quincena, <em>en dólares y en bolívares.</em></h1>
  <div class="chips"><span class="chip">Tasa BCV automática</span><span class="chip">Gastos en 2 segundos</span><span class="chip">Web y Android</span></div>
</div>
<div class="card">
  <small>Te queda esta quincena</small>
  <b>$148,20</b>
  <div class="bar"><i></i></div>
  <div class="line"><span>Mercado</span><span>$42,00</span></div>
  <div class="line"><span>Alquiler</span><span>$120,00</span></div>
  <div class="line"><span>Me deben</span><span>$25,00</span></div>
</div>
</body>
</html>
