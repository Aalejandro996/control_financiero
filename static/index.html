<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B4D">
<title>Quincena</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F6F2;--ink:#12211B;--mut:#46564E;--g:#0B6B4D;--gs:#E3F1EA;--line:#D5DDD7;--warn:#B25E00;--bad:#B3261E;--soft:#FBE7BF;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--ink:#EAF1EC;--mut:#A9B8AF;--g:#4FC79C;--gs:#173226;--line:#2A3A32;--warn:#F0A84A;--bad:#FF8A80;--soft:#3A2D12;--card:#16211C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;margin:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--g);color:#fff;border:0;border-radius:24px;padding:22px 20px}
.hero .big{font-size:48px;line-height:1.1}.bar{height:8px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn.o{background:transparent;border:2px solid var(--g);color:var(--g)}.btn.s{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.6}.link{background:none;border:0;color:var(--g);font-weight:600;min-height:44px;padding:0 8px;cursor:pointer}
input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;min-width:44px;height:36px;font-weight:600;cursor:pointer}.seg .on{background:var(--g);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}.chip.on{background:var(--gs);border-color:var(--g);color:var(--g)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item>div:first-child{flex:1;min-width:0}
.amt{font-weight:700;white-space:nowrap}.pill{display:inline-block;background:var(--soft);color:var(--warn);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:520px;justify-content:space-around}
nav button{background:none;border:0;min-width:64px;min-height:56px;font-size:12px;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--g);font-weight:600}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet form{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;z-index:30;display:none;align-items:center;gap:10px;max-width:90vw}
.auth{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const CATS={comida:'Comida',transporte:'Transporte',fijo:'Gastos fijos',hormiga:'Gastos pequeños'};
const S={user:null,csrf:null,setup:false,data:null,base:null,rev:0,tab:'inicio',sub:'gastos',psub:'pagos',cur:'USD',sheet:null,busy:false};
const $=s=>document.querySelector(s), esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate=()=>Number(S.data?.exchangeRate)||0;
const usd=(a,c)=>c==='BS'?a/(rate()||1):a;
const fmt=n=>new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const money=(a,c='USD')=>c==='BS'?'Bs. '+fmt(a):'$ '+fmt(a);
const show=u=>S.cur==='BS'?money(u*rate(),'BS'):money(u);
function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?' <button class="link" style="color:var(--g)" id="un">Deshacer</button>':'');t.style.display='flex';clearTimeout(toast.t);if(undo)$('#un').onclick=()=>{undo();t.style.display='none'};toast.t=setTimeout(()=>t.style.display='none',5000)}
function friendly(e){const m=e.message||'';if(e.status===401)return 'Tu sesión terminó. Entra de nuevo.';if(e.status>=500||/Error de servidor/.test(m))return 'Algo salió mal. Inténtalo en unos minutos.';if(e.network)return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';return m}
async function api(url,o={}){const h={'Content-Type':'application/json'};if(S.csrf&&o.method&&o.method!=='GET')h['X-CSRF-Token']=S.csrf;let r;try{r=await fetch(url,{credentials:'same-origin',...o,headers:h})}catch(e){const x=new Error('net');x.network=true;throw x}const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||'Error de servidor ('+r.status+')');e.status=r.status;throw e}return p}
async function load(){const r=await api('/api/state');S.data=r.data;S.base=JSON.parse(JSON.stringify(r.data));S.rev=r.revision;S.cur=S.data.currency==='BS'?'BS':'USD'}
let q=Promise.resolve();
function save(){q=q.then(async()=>{try{const r=await api('/api/state',{method:'PUT',body:JSON.stringify({data:S.data,base_data:S.base,base_revision:S.rev})});S.data=r.data;S.base=JSON.parse(JSON.stringify(r.data));S.rev=r.revision}catch(e){toast(friendly(e));try{await load()}catch(_){}}render()});return q}
// ---- cálculos ----
const monthKey=d=>String(d||'').slice(0,7), nowKey=()=>new Date().toISOString().slice(0,7);
function calc(){const d=S.data;let inc=0;for(const s of d.incomeSources||[]){const a=usd(s.amount,s.currency);inc+=s.frequency==='quincenal'?a*2:s.frequency==='mensual'?a:0}
if(!(d.incomeSources||[]).length)inc=usd(d.income?.amount||0,d.income?.currency);
const ex=(d.expenses||[]).filter(e=>monthKey(e.date)===nowKey());let spent=0;const cat={};for(const e of ex){const a=usd(e.amount,e.currency);spent+=a;cat[e.category]=(cat[e.category]||0)+a}
const left=inc-spent;let debt=0;for(const x of d.debts||[])debt+=usd(x.amount-(x.paid||0),x.currency);
const pay=Math.max(0,left)*((d.debtPlan?.paymentPercent??60)/100);return{inc,spent,left,cat,debt,months:debt>0&&pay>0?Math.ceil(debt/pay):null}}
function mutate(fn,msg,undo){fn();render();save();if(msg)toast(msg,undo)}

const b2u=v=>{const t=String(v).replace(/-/g,'+').replace(/_/g,'/'),x=atob(t+'='.repeat((4-t.length%4)%4)),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u.buffer},u2b=b=>{let x='';for(const y of new Uint8Array(b))x+=String.fromCharCode(y);return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function prepOpt(o){o.challenge=b2u(o.challenge);if(o.user?.id)o.user.id=b2u(o.user.id);for(const k of['allowCredentials','excludeCredentials'])if(Array.isArray(o[k]))o[k]=o[k].map(i=>({...i,id:b2u(i.id)}));return o}
function serCred(c){const r=c.response,p={clientDataJSON:u2b(r.clientDataJSON)};for(const k of['attestationObject','authenticatorData','signature','userHandle'])if(r[k])p[k]=u2b(r[k]);if(r.getTransports)p.transports=r.getTransports();return{id:c.id,rawId:u2b(c.rawId),type:c.type,response:p,clientExtensionResults:c.getClientExtensionResults()}}
async function loginPasskey(){const u=(document.querySelector('[name=username]')?.value||'').trim();if(!u){toast('Escribe tu usuario y toca de nuevo.');return}try{const s=await api('/api/passkeys/login/options',{method:'POST',body:JSON.stringify({username:u})});const c=await navigator.credentials.get({publicKey:prepOpt(s.options)});const r=await api('/api/passkeys/login/verify',{method:'POST',body:JSON.stringify({credential:serCred(c)})});S.user=r.user;S.csrf=r.csrf_token;await load();render();rates()}catch(e){toast(e.name==='NotAllowedError'?'No se completó. Inténtalo de nuevo o usa tu contraseña.':friendly(e))}}
async function regPasskey(){if(!window.PublicKeyCredential){toast('Este dispositivo no permite entrar con huella o rostro.');return}try{const s=await api('/api/passkeys/register/options',{method:'POST',body:'{}'});const c=await navigator.credentials.create({publicKey:prepOpt(s.options)});await api('/api/passkeys/register/verify',{method:'POST',body:JSON.stringify({credential:serCred(c),label:/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Este dispositivo'})});toast('Listo: ya puedes entrar con huella o rostro.')}catch(e){toast(e.name==='NotAllowedError'?'No se completó. Inténtalo de nuevo.':friendly(e))}}
async function enablePush(){if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)){toast('Este dispositivo no permite avisos desde la web.');return}try{if(await Notification.requestPermission()!=='granted'){toast('Activa las notificaciones en los ajustes del teléfono.');return}const k=await api('/api/push/public-key'),reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b2u(k.public_key)});await api('/api/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});toast('Listo: te avisaremos antes de cada pago.')}catch(e){toast('No pudimos activar los avisos. Inténtalo más tarde.')}}
function plan(){const d=S.data,s=d.debtPlan||{},c=calc(),ess=Math.max(0,+s.monthlyEssentials||0),cu=Math.max(0,+s.monthlyCushion||0),cap=Math.max(0,c.inc-ess-cu),pp=Math.max(30,Math.min(85,+s.paymentPercent||60));
const ds=(d.debts||[]).map(x=>{const bal=Math.max(0,usd(x.amount-(x.paid||0),x.currency)),min=Math.min(bal,Math.max(0,usd(+x.minPayment||0,x.currency))),known=x.interestKnown===true||(x.interestKnown===undefined&&+x.interestRate>0),r=known?Math.max(0,+x.interestRate||0)/100:0,mr=!known?0:(x.interestPeriod==='semanal'?Math.pow(1+r,52/12)-1:r);return{bal,min,mr,known}}).filter(x=>x.bal>.005);
const minT=ds.reduce((n,x)=>n+x.min,0),rec=Math.min(cap,Math.max(minT,cap*pp/100)),P={configured:s.configured===true,rec,over:minT>cap+.01,months:null,interest:0,strategy:s.strategy==='snowball'?'snowball':'avalanche'};
if(!P.configured||!ds.length||ds.some(x=>x.min<=.005)||P.over||rec<=0)return P;
const b=ds.map(x=>({...x})),total=b.reduce((n,x)=>n+x.bal,0);let m=0,int=0;
while(b.some(x=>x.bal>.02)&&m<600){m++;let it=0;for(const x of b){const i=x.bal*x.mr;x.bal+=i;it+=i}int+=it;let bud=rec;for(const x of b){if(x.bal<=.02)continue;const p=Math.min(x.min,x.bal,bud);x.bal-=p;bud-=p}
const o=b.filter(x=>x.bal>.02).sort((a,c)=>P.strategy==='snowball'?a.bal-c.bal:((c.known?c.mr:-1)-(a.known?a.mr:-1))||(a.bal-c.bal));for(const x of o){if(bud<=.005)break;const p=Math.min(x.bal,bud);x.bal-=p;bud-=p}
if(m>12&&b.reduce((n,x)=>n+x.bal,0)>=total)break}
if(!b.some(x=>x.bal>.02)){P.months=m;P.interest=int}return P}
function compromisos(){const d=S.data,pays=d.schoolPayments||[];return `<div class="card">${(d.schoolExpenses||[]).map(x=>{const left=Math.max(0,x.amount-pays.filter(p=>String(p.expenseId)===String(x.id)).reduce((n,p)=>n+p.amount,0));return `<div class="item"><div><b>${esc(x.description)}</b><div class="mut">${esc(x.student||'')}${x.dueDate?' · vence '+new Date(x.dueDate+'T00:00:00').toLocaleDateString('es-VE',{day:'numeric',month:'short'}):''}</div><div class="mut">${left>0?'Falta '+money(left,x.currency)+' de '+money(x.amount,x.currency):'Pagado'}</div></div>${left>0?`<button class="btn s" data-cpago="${esc(x.id)}">Pagar</button>`:''}</div>`}).join('')||'<span class="mut">Aquí van el colegio, el alquiler y otros pagos que repites.</span>'}</div><button class="btn" data-sheet="compromiso">Agregar compromiso</button>`}
// ---- pantallas ----
function authView(){if(S.user?.must_change_password)return `<form class="auth" id="f-pw"><h1>Elige tu contraseña</h1><p class="mut">Por seguridad, cambia la contraseña temporal antes de continuar.</p><label>Contraseña actual<input name="old_password" type="password" autocomplete="current-password" required></label><label>Contraseña nueva (mínimo 12 caracteres)<input name="new_password" type="password" autocomplete="new-password" required minlength="12"></label><button class="btn">Guardar contraseña</button></form>`;
return `<form class="auth" id="f-${S.setup?'setup':'login'}"><h1 style="color:var(--g);font-size:36px">Quincena</h1><p class="mut">Tus finanzas, solo para ti.</p><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="${S.setup?'new-password':'current-password'}" required></label>${S.setup?'<label>Código de activación<input name="bootstrap_token" required></label>':''}<button class="btn">${S.setup?'Crear mi cuenta':'Entrar'}</button>${!S.setup&&window.PublicKeyCredential?'<button type="button" class="btn o" id="pk">Entrar con huella o rostro</button>':''}</form>`}
function head(){return `<div class="row sp"><div><h1 style="color:var(--g);font-size:22px">Quincena</h1><div class="mut">${new Date().getDate()<=15?'1.ª':'2.ª'} quincena de ${new Date().toLocaleDateString('es-VE',{month:'long'})}</div></div><div class="seg"><button data-cur="USD" class="${S.cur==='USD'?'on':''}">$</button><button data-cur="BS" class="${S.cur==='BS'?'on':''}">Bs.</button></div></div>`}
function inicio(){const c=calc(),P=plan(),M=P.configured&&P.months?P.months:c.months,b=S.data.budgets||{},pct=c.inc>0?Math.min(100,Math.max(0,c.spent/c.inc*100)):0;
const next=(S.data.plannedDebtPayments||[]).filter(p=>p.status==='planned'&&p.scheduledDate).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate))[0];
let nx='';if(next){const days=Math.round((new Date(next.scheduledDate+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);nx=`<div class="card"><div class="row"><div style="flex:1"><b>${esc(next.entity||next.description||'Pago')}</b><div class="mut">${days<0?'Venció hace '+(-days)+' días':days===0?'Vence hoy':'Vence en '+days+' días'}</div></div><div class="amt">${money(next.amount,next.currency)}</div></div></div>`}
const rows=Object.keys(CATS).filter(k=>b[k]>0).map(k=>{const sp=c.cat[k]||0,p=Math.min(100,sp/b[k]*100),col=p>=95?'var(--bad)':p>=80?'var(--warn)':'var(--g)';return `<div><div class="row sp mut" style="color:var(--ink);margin-bottom:6px"><span>${CATS[k]}</span><span class="mut">${show(sp)} de ${show(b[k])}</span></div><div class="bar"><i style="width:${p}%;background:${col}"></i></div></div>`}).join('');
const msg=c.left<0?'Este mes tus gastos superan tus ingresos. Revisemos juntos dónde ajustar.':M?`Con tu ritmo actual terminas de pagar tus deudas en <b>${M} ${M===1?'mes':'meses'}</b>.`:c.debt>0?'Registra tus ingresos para calcular cuándo terminas de pagar tus deudas.':'';
const tot=Object.values(c.cat).reduce((a,b)=>a+b,0),COL={comida:'#0B6B4D',transporte:'#2F6FDE',fijo:'#B25E00',hormiga:'#B3261E'},ks=Object.keys(CATS).filter(k=>c.cat[k]>0),gr=tot>0?`<div class="card"><b>En qué se va tu dinero</b><div style="display:flex;height:14px;border-radius:99px;overflow:hidden">${ks.map(k=>`<i style="width:${c.cat[k]/tot*100}%;background:${COL[k]}"></i>`).join('')}</div>${ks.map(k=>`<div class="row sp"><span class="row" style="gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:${COL[k]}"></i>${CATS[k]}</span><span class="mut">${Math.round(c.cat[k]/tot*100)} %</span></div>`).join('')}</div>`:'';
return head()+`<div class="card hero"><div>Te quedan este mes</div><div class="big">${show(c.left)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="row sp" style="font-size:14px"><span>Gastado ${show(c.spent)}</span><span>Ingresos ${show(c.inc)}</span></div><div style="font-size:13px;opacity:.85">Dólar BCV: Bs. ${fmt(rate())}${S.rateInfo?' · '+esc(S.rateInfo):''}</div></div>${nx}${rows?`<div class="card"><b>Tu presupuesto</b>${rows}</div>`:`<div class="card"><b>Tu presupuesto</b><span class="mut">Define cuánto quieres gastar en cada categoría desde Más › Mi presupuesto.</span></div>`}${gr}${msg?`<div class="card" style="background:var(--gs)">${msg}</div>`:''}`}
function movimientos(){const d=S.data,g=S.sub==='gastos';
const list=g?(d.expenses||[]).slice(0,100).map(e=>`<div class="item"><div><b>${esc(e.description||CATS[e.category]||'Gasto')}</b><div class="mut">${CATS[e.category]||'Otros'} · ${new Date(e.date).toLocaleDateString('es-VE',{day:'numeric',month:'short'})}</div></div><div class="amt">${money(e.amount,e.currency)}</div><button class="link" data-del="expenses:${esc(e.id)}" aria-label="Eliminar gasto">Quitar</button></div>`).join(''):(d.incomeSources||[]).map(s=>`<div class="item"><div><b>${esc(s.name||'Ingreso')}</b><div class="mut">${s.frequency}</div></div><div class="amt">${money(s.amount,s.currency)}</div><button class="link" data-del="incomeSources:${esc(s.id)}" aria-label="Eliminar ingreso">Quitar</button></div>`).join('');
return head()+`<div class="chips"><button class="chip ${g?'on':''}" data-sub="gastos">Gastos</button><button class="chip ${g?'':'on'}" data-sub="ingresos">Ingresos</button></div><div class="card">${list||`<span class="mut">${g?'Aún no registras gastos. Toca + para agregar el primero.':'Agrega tu sueldo u otros ingresos para ver cuánto te queda.'}</span>`}</div>${g?'':'<button class="btn" data-sheet="ingreso">Agregar ingreso</button>'}`}
function deudas(){const ds=S.data.debts||[];const P=plan();return head()+`<div class="card"><b>Tu plan para salir de deudas</b>${P.configured?`<span>Si pagas <b>${show(P.rec)}</b> al mes${P.months?`, terminas en <b>${P.months} meses</b> (intereses estimados: ${show(P.interest)}).`:P.over?'. Tus cuotas mínimas superan lo que puedes pagar: revisa tus gastos o negocia plazos.':'. Agrega el pago mínimo de cada deuda para calcular el plazo.'}</span>`:'<span class="mut">Cuéntanos cuánto necesitas para vivir y te decimos cuánto puedes pagar sin ahogarte.</span>'}<button class="btn o" data-sheet="plan">${P.configured?'Ajustar plan':'Crear mi plan'}</button></div><div class="card">${ds.map(x=>{const left=x.amount-(x.paid||0);return `<div class="item"><div><b>${esc(x.entity||'Deuda')}</b><div class="mut">${esc(x.description||'')} Debes ${money(left,x.currency)} de ${money(x.amount,x.currency)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,(x.paid||0)/x.amount*100)}%"></i></div></div><button class="btn s" data-abono="${esc(x.id)}">Abonar</button></div>`}).join('')||'<span class="mut">No tienes deudas registradas.</span>'}</div><button class="btn" data-sheet="deuda">Agregar deuda</button>`}
function pagosProx(){const ps=(S.data.plannedDebtPayments||[]).filter(p=>p.status==='planned').sort((a,b)=>String(a.scheduledDate).localeCompare(String(b.scheduledDate)));return head()+`<div class="card">${ps.map(p=>`<div class="item"><div><b>${esc(p.entity||p.description||'Pago')}</b><div class="mut">${p.scheduledDate?new Date(p.scheduledDate+'T00:00:00').toLocaleDateString('es-VE',{day:'numeric',month:'long'}):''}</div></div><div class="amt">${money(p.amount,p.currency)}</div><button class="btn s" data-pay="${esc(p.id)}">Ya pagué</button></div>`).join('')||'<span class="mut">No tienes pagos programados.</span>'}</div><button class="btn" data-sheet="pago">Programar un pago</button>`}
function pagos(){const h=head();return h+`<div class="chips"><button class="chip ${S.psub==='pagos'?'on':''}" data-psub="pagos">Próximos pagos</button><button class="chip ${S.psub==='compromisos'?'on':''}" data-psub="compromisos">Compromisos</button></div>`+(S.psub==='compromisos'?compromisos():pagosProx().replace(h,''))}
function mas(){return head()+`<div class="card"><b>Mi presupuesto</b><span class="mut">Cuánto quieres gastar al mes, en dólares.</span><button class="btn o" data-sheet="presupuesto">Editar presupuesto</button></div><div class="card"><b>Seguridad y avisos</b><button class="btn o" id="rpk">Activar entrada con huella o rostro</button><button class="btn o" id="push">Activar avisos de pago</button></div><div class="card"><b>Mis datos</b><button class="btn o" id="dl">Descargar mis datos</button></div><div class="card"><b>${esc(S.user.username)}</b><button class="btn o" id="out">Cerrar sesión</button></div>`}
function sheetView(){const k=S.sheet;if(!k)return '';const cur=`<label>Moneda<select name="currency"><option value="USD">Dólares ($)</option><option value="BS">Bolívares (Bs.)</option></select></label>`,num=n=>`<label>${n}<input name="amount" inputmode="decimal" placeholder="0,00" required></label>`;
const F={gasto:`<h1>Nuevo gasto</h1>${num('Monto')}${cur}<label>Categoría<div class="chips" id="cats">${Object.entries(CATS).map(([v,l],i)=>`<button type="button" class="chip ${i?'':'on'}" data-cat="${v}">${l}</button>`).join('')}</div></label><label>Nota (opcional)<input name="description"></label>`,
ingreso:`<h1>Nuevo ingreso</h1><label>Nombre<input name="name" placeholder="Sueldo" required></label>${num('Monto')}${cur}<label>Frecuencia<select name="frequency"><option value="quincenal">Cada quincena</option><option value="mensual">Una vez al mes</option></select></label>`,
deuda:`<h1>Nueva deuda</h1><label>¿A quién le debes?<input name="entity" required></label>${num('Monto total')}${cur}<label>Detalle (opcional)<input name="description"></label><label>Pago mínimo al mes (opcional)<input name="minPayment" inputmode="decimal"></label><label>Interés mensual % (si lo sabes)<input name="interestRate" inputmode="decimal"></label>`,
pago:`<h1>Programar pago</h1><label>Deuda<select name="debtId">${(S.data.debts||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.entity)}</option>`).join('')}</select></label>${num('Monto')}${cur}<label>Fecha<input name="date" type="date" required></label>`,
presupuesto:`<h1>Mi presupuesto</h1>${Object.entries(CATS).map(([v,l])=>`<label>${l} (USD)<input name="${v}" inputmode="decimal" value="${S.data.budgets?.[v]||''}" placeholder="0"></label>`).join('')}`,
abono:`<h1>Abonar a ${esc((S.data.debts.find(x=>String(x.id)===S.arg)||{}).entity)}</h1>${num('Monto del abono')}`,plan:`<h1>Mi plan de deudas</h1><label>Lo que necesito para vivir al mes (USD)<input name="monthlyEssentials" inputmode="decimal" value="${S.data.debtPlan?.monthlyEssentials||''}"></label><label>Colchón para imprevistos al mes (USD)<input name="monthlyCushion" inputmode="decimal" value="${S.data.debtPlan?.monthlyCushion||''}"></label><label>Qué parte de lo que me sobra uso para deudas (30 a 85 %)<input name="paymentPercent" inputmode="numeric" value="${S.data.debtPlan?.paymentPercent||60}"></label><label>Orden de pago<select name="strategy"><option value="avalanche">Primero la deuda con más interés</option><option value="snowball">Primero la deuda más pequeña</option></select></label>`,
compromiso:`<h1>Nuevo compromiso</h1><label>Descripción<input name="description" placeholder="Mensualidad del colegio" required></label><label>¿Para quién? (opcional)<input name="student"></label><label>Tipo<select name="concept"><option value="mensualidad">Mensualidad</option><option value="matricula">Matrícula</option><option value="utiles">Útiles</option><option value="uniforme">Uniforme</option><option value="transporte">Transporte</option><option value="comedor">Comedor</option><option value="actividad">Actividad</option><option value="otro">Otro</option></select></label>${num('Monto')}${cur}<label>Vence (opcional)<input name="dueDate" type="date"></label>`,
cpago:`<h1>Pagar compromiso</h1>${num('Monto')}<label>Forma de pago<select name="method"><option value="banco">Transferencia</option><option value="pago_movil">Pago móvil</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></label><label>Referencia (opcional)<input name="reference"></label>`}[k];
return `<div class="sheet"><form id="f-sheet" data-k="${k}">${F}<button class="btn">Guardar</button><button type="button" class="btn o" id="x">Cancelar</button></form></div>`}
function render(){const a=$('#app');if(!S.user||S.user.must_change_password){a.innerHTML=authView();return}if(!S.data){a.innerHTML='<p class="mut">Cargando…</p>';return}
const icons={inicio:'<path d="M4 11l8-7 8 7v9H4z"/>',movimientos:'<path d="M4 7h16M4 12h16M4 17h10"/>',deudas:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',pagos:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',mas:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
const V={inicio,movimientos,deudas,pagos,mas}[S.tab]();
a.innerHTML=V+`<nav><div>${Object.keys(icons).map(k=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></nav><button class="fab" data-sheet="gasto" aria-label="Registrar un gasto">+</button>`+sheetView()}
// ---- eventos ----
const num=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:parseFloat(v)};
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
if(D.tab){S.tab=D.tab;S.sheet=null;render()}else if(D.sub){S.sub=D.sub;render()}else if(D.cur){S.cur=D.cur;S.data.currency=D.cur;render();save()}
else if(D.sheet){S.sheet=D.sheet;S.arg=null;render()}else if(D.abono){S.sheet='abono';S.arg=D.abono;render()}
else if(t.id==='x'){S.sheet=null;render()}else if(D.cat){document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('on',c===t))}
else if(D.del){const[k,id]=D.del.split(':'),list=S.data[k],i=list.findIndex(r=>String(r.id)===id),row=list[i];mutate(()=>list.splice(i,1),'Eliminado',()=>{list.splice(i,0,row);render();save()})}
else if(D.pay){const p=S.data.plannedDebtPayments.find(x=>String(x.id)===D.pay);mutate(()=>{p.status='paid';const x=S.data.debts.find(y=>String(y.id)===String(p.debtId));if(x)x.paid=Math.min(x.amount,(x.paid||0)+usd(p.amount,p.currency)*(x.currency==='BS'?rate():1));S.data.expenses.unshift({id:p.id+'_paid_'+Date.now(),amount:p.amount,currency:p.currency,category:'fijo',description:'Pago a '+(p.entity||'deuda'),method:'banco',bank:'',date:new Date().toISOString()})},'Pago registrado')}
else if(D.psub){S.psub=D.psub;render()}else if(D.cpago){S.sheet='cpago';S.arg=D.cpago;render()}else if(t.id==='pk')loginPasskey();else if(t.id==='rpk')regPasskey();else if(t.id==='push')enablePush();
else if(t.id==='out'){try{await api('/api/logout',{method:'POST',body:'{}'})}catch(_){}Object.assign(S,{user:null,data:null,csrf:null});await boot()}
else if(t.id==='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'}));a.download='quincena-mis-datos.json';a.click()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),btn=f.querySelector('.btn');btn.disabled=true;
try{if(f.id==='f-login'||f.id==='f-setup'){const r=await api(f.id==='f-login'?'/api/login':'/api/setup',{method:'POST',body:JSON.stringify(d)});S.user=r.user;S.csrf=r.csrf_token;if(!S.user.must_change_password)await load();render();rates()}
else if(f.id==='f-pw'){const r=await api('/api/change-password',{method:'POST',body:JSON.stringify(d)});S.user=r.user;S.csrf=r.csrf_token;await load();render()}
else if(f.id==='f-sheet'){const k=f.dataset.k,id='q'+Date.now(),amt=num(d.amount),D=S.data;if(!['presupuesto','plan'].includes(k)&&!(amt>0)){toast('Escribe un monto mayor a cero.');btn.disabled=false;return}
if(k==='cpago'){const x=(D.schoolExpenses||[]).find(y=>String(y.id)===S.arg),pd=(D.schoolPayments||[]).filter(p=>String(p.expenseId)===String(x.id)).reduce((n,p)=>n+p.amount,0);if(amt>x.amount-pd+.01){toast('El pago supera lo que falta. Baja el monto.');btn.disabled=false;return}}
mutate(()=>{D.schoolExpenses=D.schoolExpenses||[];D.schoolPayments=D.schoolPayments||[];if(k==='gasto')D.expenses.unshift({id,amount:amt,currency:d.currency,category:document.querySelector('#cats .on').dataset.cat,description:d.description||'',method:'efectivo',bank:'',date:new Date().toISOString()});
else if(k==='ingreso')D.incomeSources.unshift({id,kind:'salario',name:d.name,amount:amt,currency:d.currency,frequency:d.frequency,payDays:d.frequency==='quincenal'?[15,30]:[1]});
else if(k==='deuda')D.debts.unshift({id,type:'otro',amount:amt,currency:d.currency,entity:d.entity,description:d.description||'',paid:0,date:new Date().toISOString(),minPayment:num(d.minPayment)>0?num(d.minPayment):null,...(num(d.interestRate)>0?{interestRate:num(d.interestRate),interestKnown:true,interestPeriod:'mensual'}:{interestKnown:false})});
else if(k==='pago'){const x=D.debts.find(y=>String(y.id)===d.debtId);if(x)D.plannedDebtPayments.unshift({id,debtId:x.id,entity:x.entity,description:x.description||'',amount:amt,currency:d.currency,scheduleType:'date',scheduledDate:d.date,status:'planned'})}
else if(k==='plan'){D.debtPlan={monthlyEssentials:Math.max(0,num(d.monthlyEssentials||0)||0),monthlyCushion:Math.max(0,num(d.monthlyCushion||0)||0),paymentPercent:Math.max(30,Math.min(85,num(d.paymentPercent)||60)),strategy:d.strategy==='snowball'?'snowball':'avalanche',configured:true}}
else if(k==='compromiso')D.schoolExpenses.unshift({id,student:d.student||'',concept:d.concept,description:d.description,amount:amt,currency:d.currency,date:new Date().toISOString().slice(0,10),dueDate:d.dueDate||'',notes:''});
else if(k==='cpago'){const x=D.schoolExpenses.find(y=>String(y.id)===S.arg);D.schoolPayments.unshift({id,expenseId:x.id,amount:amt,currency:x.currency,date:new Date().toISOString().slice(0,10),method:d.method,reference:d.reference||'',notes:''});D.expenses.unshift({id:id+'_school',amount:amt,currency:x.currency,category:'fijo',description:'Pago: '+x.description,method:d.method==='efectivo'?'efectivo':d.method==='pago_movil'?'pago_movil':'banco',bank:d.reference||'',date:new Date().toISOString()})}
else if(k==='presupuesto'){for(const c of Object.keys(CATS))D.budgets[c]=Math.max(0,num(d[c]||0)||0)}
else if(k==='abono'){const x=D.debts.find(y=>String(y.id)===S.arg);x.paid=Math.min(x.amount,(x.paid||0)+amt);D.expenses.unshift({id:id+'_abono',amount:amt,currency:x.currency,category:'fijo',description:'Abono a '+x.entity,method:'banco',bank:'',date:new Date().toISOString()})}
S.sheet=null},'Guardado')}}catch(x){toast(friendly(x));btn.disabled=false}});
async function rates(){try{const r=await fetch('https://ve.dolarapi.com/v1/dolares');const l=await r.json(),o=l.find(x=>x.fuente==='oficial')||l[0];if(o&&o.promedio>0&&S.data){S.data.exchangeRate=Number(o.promedio);S.rateInfo='actualizada '+new Date(o.fechaActualizacion||Date.now()).toLocaleDateString('es-VE',{day:'numeric',month:'short'});render();save()}}catch(_){S.rateInfo='sin actualizar'; if(S.data)render()}}
async function boot(){try{const i=await api('/api/status');S.setup=i.setup_required;S.csrf=i.csrf_token;S.user=i.authenticated?i.user:null;if(S.user&&!S.user.must_change_password){await load();rates()}}catch(e){toast(friendly(e))}render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
boot();
</script>
</body>
</html>
