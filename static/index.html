<style>

@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--ink:#EAF1EC;--mut:#A9B8AF;--g:#4FC79C;--gs:#173226;--line:#2A3A32;--warn:#F0A84A;--bad:#FF8A80;--soft:#3A2D12;--card:#16211C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--g);color:#fff;border:0;border-radius:24px;padding:22px 20px}.hero.neg{background:#9C2B24}
.hero .big{font-size:48px;line-height:1.1}.bar{height:8px;border-radius:99px;background:rgba(127,127,127,.25);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.hero .bar{background:rgba(255,255,255,.28)}.hero .bar i{background:#fff}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn.o{background:transparent;border:2px solid var(--g);color:var(--g)}.btn.s{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.6}.link{background:none;border:0;color:var(--g);font-weight:600;min-height:44px;padding:0 8px;cursor:pointer}
input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}

.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item>div:first-child{flex:1;min-width:0}
.amt{font-weight:700;white-space:nowrap}.pill{display:inline-block;background:var(--soft);color:var(--warn);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:520px;justify-content:space-around}
nav button{background:none;border:0;min-width:64px;min-height:56px;font-size:12px;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--g);font-weight:600}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet form{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;z-index:30;display:none;align-items:center;gap:10px;max-width:90vw}
.auth{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.apkm{position:fixed;inset:0;background:rgba(8,20,15,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:25;animation:apf .2s ease}
.apkm .box{background:var(--card);width:100%;max-width:380px;border-radius:28px;padding:26px 22px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:apu .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.apkm .top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 12px;border-radius:20px;background:linear-gradient(160deg,var(--gs),transparent)}
.apkm .ic{width:76px;height:76px;border-radius:22px;box-shadow:0 8px 22px rgba(11,107,77,.35)}
.apkm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}.apkm li{display:flex;gap:10px;align-items:flex-start}.apkm li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gs);color:var(--g);font-style:normal;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.apkm .tag{display:inline-block;background:var(--gs);color:var(--g);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.apkm a.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.apkm details{border:1px solid var(--line);border-radius:14px;padding:4px 14px}.apkm summary{min-height:40px;display:flex;align-items:center;font-weight:600;cursor:pointer}.apkm ol{margin:4px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:14px}
.apkb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}.apkb img{width:40px;height:40px;border-radius:12px}
@keyframes apf{from{opacity:0}}@keyframes apu{from{opacity:0;transform:translateY(24px) scale(.97)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:82px;cursor:pointer;min-width:0}.tile:active{transform:scale(.98)}.tile .tk{font-size:12.5px;color:var(--mut);font-weight:600}.tile .tv{font:700 21px/1.25 'Bricolage Grotesque',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .ts{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}.hseg{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}.hseg button{border:0;background:transparent;color:#fff;border-radius:99px;min-width:42px;height:30px;font-weight:600;font-size:13px;cursor:pointer}.hseg .on{background:#fff;color:var(--g)}.hero.neg .hseg .on{color:#9C2B24}
.dash{display:flex;flex-direction:column;gap:14px}nav .brand,nav .navadd,nav .navuser,.ptitle{display:none}

nav{top:0;bottom:0;left:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:26px 14px;display:block}

nav .brand{display:block;font:700 28px 'Bricolage Grotesque',sans-serif;color:var(--g);padding:0 12px 22px}
nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-size:15px;width:100%}
nav button:hover{background:var(--gs);color:var(--g)}nav button.on{background:var(--gs)}
nav .navadd{display:flex;justify-content:center;margin-top:16px;background:var(--g);color:#fff;font-weight:600}nav .navadd:hover{background:var(--g);color:#fff;filter:brightness(1.08)}
nav .navuser{display:block;margin-top:auto;padding:0 14px;color:var(--mut);font-size:14px}
.fab{display:none}
#app{max-width:1060px;margin:0 auto 0 max(236px,calc(236px + (100vw - 236px - 1060px)/2));padding:34px 40px 60px;gap:18px}
#app.v-movimientos,#app.v-deudas,#app.v-pagos{max-width:860px;margin-left:max(236px,calc(236px + (100vw - 236px - 860px)/2))}
.head .logo{display:none}.head .ptitle{display:block;font-size:30px;color:var(--ink)}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}

#app.v-mas{display:grid;grid-template-columns:1fr 1fr;align-content:start}#app.v-mas>.head{grid-column:1/-1}
.sheet{align-items:center;padding:24px}.sheet form{border-radius:24px;max-width:500px;max-height:88vh;box-shadow:0 24px 60px rgba(0,0,0,.3)}

.btn:hover{filter:brightness(1.07)}.chip:hover{border-color:var(--g)}
.apkb{display:none}
}
@media(min-width:1280px){.tiles{grid-template-columns:repeat(3,1fr)}.dash{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}}
.quick{display:flex;gap:8px;overflow-x:auto;align-items:center;scrollbar-width:none;margin:-2px -16px;padding:2px 16px}.quick::-webkit-scrollbar{display:none}.quick .chip{flex:none;min-height:38px;font-size:14px;white-space:nowrap}
.spin{width:28px;height:28px;border:3px solid var(--gs);border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:900px){.quick{margin:0;padding:0;flex-wrap:wrap}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal .ch{font-size:12px;color:var(--mut);font-weight:600;padding:2px 0}
.cd{border:0;background:transparent;border-radius:10px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}.cd i{display:flex;gap:2px;height:6px}.cd i b{width:6px;height:6px;border-radius:50%}.cd.today{font-weight:700;color:var(--g)}.cd.sel{background:var(--gs)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}.calday{display:flex;flex-direction:column;gap:6px}
.ckbar{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:26;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:14px;max-width:520px;margin:0 auto}
.auth~.ckbar{bottom:16px}.legal a,.auth a,.ckbar a,.terms a{color:var(--g)}
nav .navuser small{display:block;font-size:11px;margin-top:4px;opacity:.8}
@media(min-width:900px){.ckbar{left:auto;right:24px;bottom:24px;max-width:420px}}
</style>

<body>
<div id="app"></div><div id="toast"></div>
<script>
const CATS={comida:'Comida',transporte:'Transporte',fijo:'Gastos fijos',hormiga:'Gastos pequeños',salud:'Salud',hogar:'Hogar',ocio:'Ocio',educacion:'Educación',deudas:'Pagos de deudas'};
const S={user:null,csrf:null,setup:false,data:null,base:null,rev:0,tab:'inicio',q:'',mon:'',per:null,sub:'gastos',psub:'pagos',cur:'USD',sheet:null,busy:false};
try{S.hide=localStorage.getItem('qh')==='1'}catch(_){}
const $=s=>document.querySelector(s), esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate=()=>Number(S.data?.exchangeRate)||0;
const usd=(a,c)=>c==='BS'?a/(rate()||1):a;
const fmt=n=>new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const money=(a,c='USD')=>S.hide?'••••':c==='BS'?'Bs. '+fmt(a):'$ '+fmt(a);
const show=u=>S.cur==='BS'?money(u*rate(),'BS'):money(u);
// ---- Las tres tasas ----
const mrate=()=>Number(S.data?.marketRate)||0;
const RT={bcv:'BCV',usdt:'USDT',otra:'otra tasa'};
// Costo real en USD de un gasto: si fue en Bs., se divide entre la tasa a la que conseguiste esos bolívares.
const realUsd=e=>e.currency==='BS'?e.amount/(Number(e.rateUsed)||Number(e.bcvRate)||rate()||1):e.amount;
const bcvUsd=e=>e.currency==='BS'?e.amount/(Number(e.bcvRate)||rate()||1):e.amount;
function tasas(){const ex=(S.data.expenses||[]).filter(e=>monthKey(e.date)===nowKey()&&e.currency==='BS');let bs=0,atB=0,real=0,tagged=0;for(const e of ex){bs+=e.amount;atB+=bcvUsd(e);real+=realUsd(e);if(e.rateType&&e.rateType!=='bcv')tagged++}return{n:ex.length,bs,atB,real,diff:atB-real,tagged}}
function rateBox(e={}){const t=e.currency==='BS'?(e.rateType||'bcv'):'bcv',m=mrate();return `<div id="ratebox" style="display:${e.currency==='BS'?'flex':'none'};flex-direction:column;gap:8px"><label style="margin:0">¿A qué tasa conseguiste esos bolívares?</label><div class="chips" id="rts"><button type="button" class="chip ${t==='bcv'?'on':''}" data-rt="bcv">BCV · ${fmt(rate())}</button>${m?`<button type="button" class="chip ${t==='usdt'?'on':''}" data-rt="usdt">USDT · ${fmt(m)}</button>`:''}${lastCambio()?`<button type="button" class="chip ${t==='cambio'?'on':''}" data-rt="cambio">Tu cambio · ${fmt(lastCambio())}</button>`:''}<button type="button" class="chip ${t==='otra'?'on':''}" data-rt="otra">Otra</button></div><input name="rateOther" inputmode="decimal" placeholder="Bs. por dólar" value="${t==='otra'?iv(e.rateUsed):''}" style="display:${t==='otra'?'block':'none'}" aria-label="Tasa en bolívares por dólar"><span class="mut">Así calculamos cuánto te costó de verdad en dólares.</span></div>`}
function rateFields(f,cur){if(cur!=='BS')return{rateType:undefined,rateUsed:undefined,bcvRate:undefined,marketRate:undefined};const t=f.querySelector('#rts .on')?.dataset.rt||'bcv',o=num(f.querySelector('[name=rateOther]')?.value||'');if(t==='cambio'&&lastCambio())return{rateType:'otra',rateUsed:lastCambio(),bcvRate:rate(),marketRate:mrate()||undefined};const used=t==='usdt'&&mrate()?mrate():t==='otra'&&o>0?o:rate();return{rateType:t==='otra'&&!(o>0)?'bcv':t,rateUsed:used,bcvRate:rate(),marketRate:mrate()||undefined}}
function clean(o){for(const k in o)if(o[k]===undefined)delete o[k];return o}
function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?' <button class="link" style="color:var(--g)" id="un">Deshacer</button>':'');t.style.display='flex';clearTimeout(toast.t);if(undo)$('#un').onclick=()=>{undo();t.style.display='none'};toast.t=setTimeout(()=>t.style.display='none',5000)}
function friendly(e){const m=e.message||'';if(e.status===401)return 'Tu sesión terminó. Entra de nuevo.';if(e.status>=500||/Error de servidor/.test(m))return 'Algo salió mal. Inténtalo en unos minutos.';if(e.network)return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';return m}
async function api(url,o={}){const h={'Content-Type':'application/json'};if(S.csrf&&o.method&&o.method!=='GET')h['X-CSRF-Token']=S.csrf;let r;try{r=await fetch(url,{credentials:'same-origin',...o,headers:h})}catch(e){const x=new Error('net');x.network=true;throw x}const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||'Error de servidor ('+r.status+')');e.status=r.status;if(r.status===401&&S.user&&!/\/api\/(login|status|logout)/.test(url)){Object.assign(S,{user:null,data:null,sheet:null});setTimeout(()=>{render();toast('Tu sesión se cerró por seguridad. Entra de nuevo.')},0)}throw e}return p}
async function load(){const r=await api('/api/state');S.data=r.data;S.base=JSON.parse(JSON.stringify(r.data));S.rev=r.revision;S.cur=S.data.currency==='BS'?'BS':'USD';let mg=0;for(const e of S.data.expenses||[])if(e.category==='fijo'&&(/_abono$/.test(String(e.id))||/_paid_/.test(String(e.id))||/^(Abono a |Pago a )/.test(e.description||''))){e.category='deudas';mg++}const gn=genRecurring();if(mg||gn)setTimeout(save,0)}
let q=Promise.resolve();
function save(){q=q.then(async()=>{try{const r=await api('/api/state',{method:'PUT',body:JSON.stringify({data:S.data,base_data:S.base,base_revision:S.rev})});S.data=r.data;S.base=JSON.parse(JSON.stringify(r.data));S.rev=r.revision}catch(e){toast(friendly(e));try{await load()}catch(_){}}render()});return q}
// ---- cálculos ----
const monthKey=d=>String(d||'').slice(0,7), nowKey=()=>new Date().toISOString().slice(0,7);
function calc(){const d=S.data;let inc=0;for(const s of d.incomeSources||[]){const a=usd(s.amount,s.currency);inc+=s.frequency==='quincenal'?a*2:s.frequency==='mensual'?a:0}
if(!(d.incomeSources||[]).length)inc=usd(d.income?.amount||0,d.income?.currency);{const mk=nowKey();inc+=extraIn(mk+'-01',mk+'-31')}
const ex=(d.expenses||[]).filter(e=>monthKey(e.date)===nowKey());let spent=0;const cat={};for(const e of ex){const a=usd(e.amount,e.currency);spent+=a;cat[e.category]=(cat[e.category]||0)+a}
const left=inc-spent;let debt=0;for(const x of d.debts||[])debt+=usd(x.amount-(x.paid||0),x.currency);
const pay=Math.max(0,left)*((d.debtPlan?.paymentPercent??60)/100);return{inc,spent,left,cat,debt,pay,months:debt>0&&pay>0?Math.ceil(debt/pay):null}}
function mutate(fn,msg,undo){fn();render();save();if(msg)toast(msg,undo)}

// BORRADOR: revisar con un abogado antes de publicar.
const CONTACTO='[escribe aquí tu correo de contacto]';
const LEGAL=[['Qué datos guardamos','Tu usuario, tu correo y la información financiera que tú registras: ingresos, gastos, deudas, pagos y compromisos.'],['Para qué los usamos','Solo para que Quincena funcione: mostrarte tus cuentas, enviarte avisos de pago y el correo para recuperar tu contraseña. No vendemos tus datos ni los usamos para publicidad.'],['Quién más interviene','El servicio donde se aloja la app, Gmail para enviar correos y un servicio público para consultar el dólar BCV, que no recibe tus datos personales.'],['Seguridad','Tu contraseña se guarda cifrada y la conexión es segura. Ninguna medida es infalible, por eso te pedimos elegir una contraseña larga y no compartirla.'],['Tus derechos','Puedes descargar tus datos, corregirlos y eliminar tu cuenta cuando quieras desde Más. Al eliminarla, se borran tu cuenta y tus datos.'],['Importante','Quincena es una herramienta para organizarte. No ofrece asesoría financiera, legal ni contable, y sus cálculos son estimados.'],['Tu cuenta','Eres responsable de tu contraseña y de que la información que registras sea correcta.'],['Cambios y contacto','Si cambiamos estos textos, te avisaremos en la app. Para consultas escríbenos a '+CONTACTO+'.']];
const b2u=v=>{const t=String(v).replace(/-/g,'+').replace(/_/g,'/'),x=atob(t+'='.repeat((4-t.length%4)%4)),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u.buffer},u2b=b=>{let x='';for(const y of new Uint8Array(b))x+=String.fromCharCode(y);return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function prepOpt(o){o.challenge=b2u(o.challenge);if(o.user?.id)o.user.id=b2u(o.user.id);for(const k of['allowCredentials','excludeCredentials'])if(Array.isArray(o[k]))o[k]=o[k].map(i=>({...i,id:b2u(i.id)}));return o}
function serCred(c){const r=c.response,p={clientDataJSON:u2b(r.clientDataJSON)};for(const k of['attestationObject','authenticatorData','signature','userHandle'])if(r[k])p[k]=u2b(r[k]);if(r.getTransports)p.transports=r.getTransports();return{id:c.id,rawId:u2b(c.rawId),type:c.type,response:p,clientExtensionResults:c.getClientExtensionResults()}}

document.addEventListener('click',e=>{const c=e.target.closest('[data-rt]');if(!c)return;document.querySelectorAll('[data-rt]').forEach(x=>x.classList.toggle('on',x===c));const o=document.querySelector('[name=rateOther]');if(o){o.style.display=c.dataset.rt==='otra'?'block':'none';if(c.dataset.rt==='otra')o.focus()}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#f-caja')){const r=document.getElementById('cj-r');if(r)r.innerHTML=cajaHtml();return}if(e.target.id==='sq'){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#sq');i.focus();i.setSelectionRange(p,p)}});document.addEventListener('change',e=>{if(e.target.id==='mon'){S.mon=e.target.value;render()}});
async function rates(){mailStatus();try{const r=await api('/api/rate');if(S.data){S.data.exchangeRate=r.rate;if(r.parallel)S.data.marketRate=r.parallel;{const h=S.data.rateHistory=S.data.rateHistory||[],t=ymd(new Date()),e={d:t,b:r.rate,m:r.parallel||0};if(h.length&&h[h.length-1].d===t)h[h.length-1]=e;else h.push(e);if(h.length>120)h.splice(0,h.length-120)}S.rateInfo='actualizada '+new Date(r.updated_at).toLocaleDateString('es-VE',{day:'numeric',month:'short'});render();save()}}catch(_){S.rateInfo='sin actualizar';if(S.data)render()}}
async function boot(){try{const i=await api('/api/status');S.setup=i.setup_required;S.reg=!!i.registration_open;{const q=new URLSearchParams(location.search).get('reset');if(q&&!i.authenticated){S.auth='reset';S.resetToken=q}}{const v=new URLSearchParams(location.search).get('verify');if(v){try{await api('/api/verify-email',{method:'POST',body:JSON.stringify({token:v})});toast('Correo confirmado. ¡Gracias!')}catch(e){toast(friendly(e))}history.replaceState(null,'','/')}}S.csrf=i.csrf_token;S.user=i.authenticated?i.user:null;if(S.user&&!S.user.must_change_password){await load();rates();if(new URLSearchParams(location.search).get('nuevo')==='gasto'){S.sheet='gasto';history.replaceState(null,'','/')}}}catch(e){toast(friendly(e))}clearTimeout(boot.t);render();maybeApk()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
$('#app').innerHTML='<div class="auth" style="align-items:center;text-align:center;gap:10px"><h1 style="color:var(--g);font-size:36px">Quincena</h1><div class="spin"></div><p class="mut" id="wake">Cargando…</p></div>';
boot.t=setTimeout(()=>{const w=$('#wake');if(w)w.textContent='Despertando el servidor… la primera vez puede tardar hasta un minuto.'},4000);
boot();
