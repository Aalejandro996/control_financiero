<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Control financiero personal sincronizado y protegido.">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Control Financiero - Recuperación Económica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <script>
        // --- GLOBAL STATE & LOCAL STORAGE ---
        // Definimos el estado por defecto si no hay nada guardado
        const defaultState = {
            view: 'login', // login, dashboard, expenses, debts
            role: null, // 'supervisor', 'deudor'
            currency: 'USD', // Global display currency: 'USD' or 'BS'
            exchangeRate: 40.00, // Tasa de respaldo
            
            income: { amount: 0, currency: 'USD' },
            incomeSources: [],
            schoolExpenses: [],
            schoolPayments: [],
            debtPlan: { monthlyEssentials: 0, monthlyCushion: 0, paymentPercent: 60, strategy: 'avalanche', configured: false },
            budgets: { transporte: 0, comida: 0, fijo: 0, hormiga: 0 },
            expenses: [],
            debts: [],
            plannedDebtPayments: [],
            
            modals: { active: null, data: null }
        };

        // La base de datos del servidor será la fuente compartida. Si existían datos
        // del HTML anterior en este navegador, los mantenemos en memoria solo para
        // ofrecer una migración explícita después del primer inicio de sesión.
        window.legacyLocalState = null;
        try {
            const oldLocalData = localStorage.getItem('finControlDataLocal');
            if (oldLocalData) window.legacyLocalState = JSON.parse(oldLocalData);
        } catch (error) {
            window.legacyLocalState = null;
        }
        window.state = JSON.parse(JSON.stringify(defaultState));
        window.authUser = null;
        window.setupRequired = false;
        window.csrfToken = null;
        window.cloudRevision = 0;
        window.cloudSnapshot = null;
        window.syncInProgress = false;
        window.syncAgain = false;
        window.usersCache = [];
        window.notify = (message, type = 'info') => {
            let node = document.getElementById('app-toast');
            if (!node) {
                node = document.createElement('div');
                node.id = 'app-toast';
                node.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] max-w-[92vw] px-4 py-3 rounded-xl shadow-xl text-sm font-semibold';
                document.body.appendChild(node);
            }
            node.textContent = message;
            node.style.background = type === 'error' ? '#fee2e2' : type === 'success' ? '#d1fae5' : '#e0f2fe';
            node.style.color = type === 'error' ? '#991b1b' : type === 'success' ? '#065f46' : '#075985';
            node.classList.remove('hidden');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => node.classList.add('hidden'), 5200);
        };
        window.escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        window.sharedDataFromState = () => ({
            currency: window.state.currency,
            exchangeRate: window.state.exchangeRate,
            income: window.state.income,
            incomeSources: window.state.incomeSources || [],
            schoolExpenses: window.state.schoolExpenses || [],
            schoolPayments: window.state.schoolPayments || [],
            debtPlan: window.state.debtPlan || { monthlyEssentials: 0, monthlyCushion: 0, paymentPercent: 60, strategy: 'avalanche', configured: false },
            budgets: window.state.budgets,
            expenses: window.state.expenses,
            debts: window.state.debts
        });
        // Comparación estable: el orden de las propiedades de objetos no debe
        // provocar sincronizaciones o repintados innecesarios.
        window.stableJSON = (value) => JSON.stringify(value, (_key, item) => {
            if (item && typeof item === 'object' && !Array.isArray(item)) {
                return Object.keys(item).sort().reduce((sorted, key) => {
                    sorted[key] = item[key];
                    return sorted;
                }, {});
            }
            return item;
        });
        window.applySharedData = (data) => {
            const keepView = window.state.view;
            const keepRole = window.state.role;
            window.state = { ...window.state, ...data, view: keepView, role: keepRole, modals: { active: null, data: null } };
        };
        window.clearClientSession = () => {
            window.authUser = null;
            window.csrfToken = null;
            window.cloudSnapshot = null;
            window.cloudRevision = 0;
            window.state = JSON.parse(JSON.stringify(defaultState));
            window.updateUI();
        };
        window.apiRequest = async (url, options = {}) => {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (window.csrfToken && !['GET', 'HEAD'].includes((options.method || 'GET').toUpperCase())) headers['X-CSRF-Token'] = window.csrfToken;
            let response;
            try { response = await fetch(url, { credentials: 'same-origin', ...options, headers }); }
            catch (error) { throw new Error('No hay conexión con el servidor. Comprueba internet e inténtalo de nuevo.'); }
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                const err = new Error(payload.error || `Error de servidor (${response.status})`);
                err.status = response.status; err.payload = payload;
                if (response.status === 401 && window.authUser && !['/api/login', '/api/setup'].includes(url)) window.clearClientSession();
                throw err;
            }
            return payload;
        };
        window.refreshSharedState = async () => {
            const result = await window.apiRequest('/api/state');
            window.cloudRevision = result.revision;
            window.cloudSnapshot = JSON.parse(JSON.stringify(result.data));
            window.applySharedData(result.data);
        };
        window.syncSharedState = async () => {
            if (!window.authUser || window.authUser.must_change_password || !window.cloudSnapshot) return;
            if (window.syncInProgress) {
                if (JSON.stringify(window.sharedDataFromState()) !== JSON.stringify(window.cloudSnapshot)) window.syncAgain = true;
                return;
            }
            if (JSON.stringify(window.sharedDataFromState()) === JSON.stringify(window.cloudSnapshot)) return;
            window.syncInProgress = true;
            try {
                const sentData = JSON.parse(JSON.stringify(window.sharedDataFromState()));
                const previousBase = JSON.parse(JSON.stringify(window.cloudSnapshot));
                const body = { data: sentData, base_data: previousBase, base_revision: window.cloudRevision };
                const result = await window.apiRequest('/api/state', { method: 'PUT', body: JSON.stringify(body) });
                const latestLocal = JSON.parse(JSON.stringify(window.sharedDataFromState()));
                const mergedView = JSON.parse(JSON.stringify(result.data));
                // Preserve edits made while the request was in flight, without discarding
                // rows concurrently added on the other device.
                for (const key of ['currency', 'exchangeRate', 'income', 'budgets', 'debtPlan']) {
                    if (JSON.stringify(latestLocal[key]) !== JSON.stringify(sentData[key])) mergedView[key] = latestLocal[key];
                }
                for (const key of ['expenses', 'debts', 'incomeSources', 'schoolExpenses', 'schoolPayments']) {
                    const baseRows = new Map((sentData[key] || []).map(row => [String(row.id), row]));
                    const localRows = new Map((latestLocal[key] || []).map(row => [String(row.id), row]));
                    const remoteRows = new Map((result.data[key] || []).map(row => [String(row.id), row]));
                    const ids = new Set([...baseRows.keys(), ...localRows.keys()]);
                    for (const id of ids) {
                        const before = baseRows.get(id), after = localRows.get(id);
                        if (JSON.stringify(before) === JSON.stringify(after)) continue;
                        if (after === undefined) remoteRows.delete(id); else remoteRows.set(id, after);
                    }
                    mergedView[key] = Array.from(remoteRows.values()).sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
                }
                const visibleDataBeforeMerge = window.stableJSON(window.sharedDataFromState());
                window.cloudRevision = result.revision;
                window.cloudSnapshot = JSON.parse(JSON.stringify(result.data));
                window.applySharedData(mergedView);
                // No reconstruir todo el DOM para cada respuesta de guardado; hacerlo
                // solo si la fusión incorporó datos que no estaban ya en pantalla.
                if (window.stableJSON(window.sharedDataFromState()) !== visibleDataBeforeMerge) window.updateUI();
                if (window.stableJSON(window.sharedDataFromState()) !== window.stableJSON(window.cloudSnapshot)) window.syncAgain = true;
            } catch (error) {
                if (error.status === 409 && error.payload?.data) {
                    window.cloudRevision = error.payload.revision;
                    window.cloudSnapshot = JSON.parse(JSON.stringify(error.payload.data));
                    window.applySharedData(error.payload.data);
                    window.updateUI();
                    window.notify(error.message, 'error');
                } else if (error.status === 401) {
                    window.clearClientSession();
                } else {
                    window.notify('No se pudo sincronizar con la nube. Mantén esta pestaña abierta y vuelve a conectarte para guardar los cambios.', 'error');
                }
            } finally {
                window.syncInProgress = false;
                if (window.syncAgain) {
                    window.syncAgain = false;
                    window.syncSharedState();
                }
            }
        };
        window.saveState = () => {
            window.updateUI();
            if (window.cloudSnapshot && window.stableJSON(window.sharedDataFromState()) !== window.stableJSON(window.cloudSnapshot)) window.syncSharedState();
        };
        // --- UTILS FORMATO MONEDA ---
        window.formatMoney = (amount, currencyCode) => {
            const code = currencyCode === 'BS' ? 'VES' : currencyCode;
            try {
                return new Intl.NumberFormat('es-VE', { style: 'currency', currency: code }).format(amount);
            } catch (e) {
                return `${code === 'VES' ? 'Bs.' : '$'} ${parseFloat(amount).toFixed(2)}`;
            }
        };

        window.convertToUSD = (amount, currencyCode) => {
            if (currencyCode === 'USD') return parseFloat(amount);
            return parseFloat(amount) / window.state.exchangeRate;
        };

        window.convertToVES = (amount, currencyCode) => {
            if (currencyCode === 'BS' || currencyCode === 'VES') return parseFloat(amount);
            return parseFloat(amount) * window.state.exchangeRate;
        };

        window.getDisplayAmount = (usdAmount) => {
            if (window.state.currency === 'USD') {
                return window.formatMoney(usdAmount, 'USD');
            } else {
                return window.formatMoney(window.convertToVES(usdAmount, 'USD'), 'VES');
            }
        };

        window.formatDate = (isoString) => {
            const d = new Date(isoString);
            return d.toLocaleDateString('es-VE', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        // --- FETCH BCV API ---
        window.fetchBCVRate = async () => {
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares');
                if (!response.ok) throw new Error(`BCV API respondió ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error('Respuesta de tasa inválida');
                const oficial = data.find(d => d.fuente === 'oficial' || (d.nombre || '').toLowerCase().includes('bcv')) || data[0];
                if (oficial && Number(oficial.promedio) > 0) {
                    const nextRate = Number(oficial.promedio);
                    if (Math.abs(nextRate - Number(window.state.exchangeRate)) >= 0.005) {
                        window.state.exchangeRate = nextRate;
                        // Actualizar solo la cifra de la cabecera. La recarga completa
                        // reiniciaba la animación de toda la pantalla al llegar la tasa.
                        const rateNode = document.getElementById('exchange-rate-value');
                        if (rateNode) rateNode.textContent = `Bs. ${nextRate.toFixed(2)}`;
                        // Si la vista está mostrando bolívares, los importes convertidos
                        // también deben refrescarse; en USD basta cambiar la tasa de cabecera.
                        if (window.state.currency === 'BS' && window.authUser) window.updateUI();
                        if (window.authUser && window.cloudSnapshot) window.syncSharedState();
                    }
                }
            } catch (error) {
                // Una caída de la API cambiaria no debe redibujar la aplicación.
                console.warn("No se pudo actualizar la tasa; se conserva la tasa guardada:", error.message);
            }
        };

        // --- LOGIC FUNCTIONS ---
        window.getTotals = () => {
            const sources = window.state.incomeSources || [];
            const recurringIncomeUSD = sources.reduce((sum, row) => {
                const amount = window.convertToUSD(Number(row.amount) || 0, row.currency);
                return sum + (row.frequency === 'quincenal' ? amount * 2 : row.frequency === 'mensual' ? amount : 0);
            }, 0);
            const incomeUSD = sources.length ? recurringIncomeUSD : window.convertToUSD(window.state.income.amount, window.state.income.currency);
            
            // Gastos de ESTE MES
            const now = new Date();
            const expensesThisMonth = window.state.expenses.filter(exp => {
                const d = new Date(exp.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });

            const expensesUSD = expensesThisMonth.reduce((sum, exp) => sum + window.convertToUSD(exp.amount, exp.currency), 0);
            
            // Deuda Total Restante
            const totalDebtUSD = window.state.debts.reduce((sum, debt) => sum + window.convertToUSD(debt.amount - (debt.paid || 0), debt.currency), 0);
            
            return { income: incomeUSD, expenses: expensesUSD, debt: totalDebtUSD, available: incomeUSD - expensesUSD };
        };

        window.getCategorySpends = () => {
            const spends = { transporte: 0, comida: 0, fijo: 0, hormiga: 0 };
            const now = new Date();
            window.state.expenses.forEach(exp => {
                const d = new Date(exp.date);
                if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                    if (spends[exp.category] !== undefined) {
                        spends[exp.category] += window.convertToUSD(exp.amount, exp.currency);
                    }
                }
            });
            return spends;
        };

        // --- NAVIGATION & UI STATES ---
        window.updateUI = () => {
            const appDiv = document.getElementById('app-root');
            if (!appDiv) return;
            if (!window.authUser) {
                appDiv.innerHTML = window.setupRequired ? renderSetupScreen() : renderAuthScreen();
                return;
            }
            if (window.authUser.must_change_password) {
                appDiv.innerHTML = renderPasswordChangeScreen();
                return;
            }
            if (window.state.view === 'login') appDiv.innerHTML = renderLogin();
            else appDiv.innerHTML = renderMainLayout();
            appDiv.insertAdjacentHTML('beforeend', renderModal());
        };

        window.setView = (view) => {
            window.state.view = view;
            window.saveState();
        };

        window.toggleGlobalCurrency = () => {
            window.state.currency = window.state.currency === 'USD' ? 'BS' : 'USD';
            window.saveState();
        };

        window.selectRole = (role) => {
            if (!role) { window.logoutAccount(); return; }
            if (role === 'supervisor' && window.authUser?.role !== 'admin') return;
            window.state.role = role;
            window.state.view = 'dashboard';
            window.saveState();
        };

        window.offerLegacyDataImport = async () => {
            const old = window.legacyLocalState;
            if (!old) return;
            const hasData = (Array.isArray(old.expenses) && old.expenses.length) ||
                (Array.isArray(old.debts) && old.debts.length) || Number(old.income?.amount || 0) !== 0 ||
                Object.values(old.budgets || {}).some(value => Number(value || 0) !== 0);
            if (!hasData) { window.legacyLocalState = null; return; }
            const cloudIsEmpty = window.cloudRevision === 0 &&
                (!window.cloudSnapshot?.expenses?.length) && (!window.cloudSnapshot?.debts?.length) &&
                !window.cloudSnapshot?.debtPlan?.configured &&
                Number(window.cloudSnapshot?.income?.amount || 0) === 0 &&
                Object.values(window.cloudSnapshot?.budgets || {}).every(value => Number(value || 0) === 0);
            if (!cloudIsEmpty || window.authUser?.role !== 'admin') {
                window.notify('Hay datos locales de la versión anterior, pero no se importaron porque la nube no está vacía o no tienes permisos de administrador. Exporta el respaldo local para conservarlos.', 'info');
                window.legacyLocalState = null;
                return;
            }
            if (!confirm('Este navegador contiene registros de la versión anterior. ¿Quieres importarlos al espacio compartido para que estén disponibles en laptop y Pixel? Solo se hará si la base de datos en la nube está vacía. Si cancelas, los datos antiguos locales se conservarán.')) {
                window.legacyLocalState = null;
                return;
            }
            const legacyImport = {
                currency: old.currency === 'BS' ? 'BS' : 'USD',
                exchangeRate: Number(old.exchangeRate) > 0 ? Number(old.exchangeRate) : 40,
                income: old.income && typeof old.income === 'object' ? old.income : { amount: 0, currency: 'USD' },
                budgets: old.budgets && typeof old.budgets === 'object' ? old.budgets : { transporte: 0, comida: 0, fijo: 0, hormiga: 0 },
                expenses: Array.isArray(old.expenses) ? old.expenses.filter(row => row && /^[A-Za-z0-9_-]{1,100}$/.test(String(row.id || ''))).map(row => ({ ...row, category: ['comida','transporte','fijo','hormiga'].includes(row.category) ? row.category : 'fijo', amount: Math.max(0, Number(row.amount) || 0), currency: row.currency === 'BS' ? 'BS' : 'USD', description: String(row.description || 'Gasto').slice(0,250), bank: String(row.bank || '').slice(0,120) })) : [],
                debts: Array.isArray(old.debts) ? old.debts.filter(row => row && /^[A-Za-z0-9_-]{1,100}$/.test(String(row.id || ''))).map(row => ({ ...row, type: ['tdc','cashea','prestamo','otro'].includes(row.type) ? row.type : 'otro', amount: Math.max(0, Number(row.amount) || 0), paid: Math.max(0, Number(row.paid) || 0), currency: row.currency === 'BS' ? 'BS' : 'USD', entity: String(row.entity || 'Entidad').slice(0,120), description: String(row.description || 'Deuda').slice(0,250), interestRate: Math.max(0, Number(row.interestRate) || 0), interestPeriod: ['mensual','semanal'].includes(row.interestPeriod) ? row.interestPeriod : 'mensual' })) : []
            };
            try {
                const result = await window.apiRequest('/api/import-legacy', { method: 'POST', body: JSON.stringify({ data: legacyImport }) });
                window.cloudRevision = result.revision;
                window.cloudSnapshot = JSON.parse(JSON.stringify(result.data));
                window.applySharedData(result.data);
                window.legacyLocalState = null;
                try { localStorage.removeItem('finControlDataLocal'); } catch (_) {}
                window.notify('Datos anteriores enviados a la base compartida.', 'success');
            } catch (error) {
                window.notify(error.message + ' Los datos locales antiguos se conservaron.', 'error');
            }
        };

        window.finishAuthentication = async (result) => {
            window.authUser = result.user;
            window.csrfToken = result.csrf_token;
            window.state.role = result.user.role === 'admin' ? 'supervisor' : 'deudor';
            window.state.view = 'dashboard';
            if (!result.user.must_change_password) {
                try {
                    await window.refreshSharedState();
                    window.state.role = result.user.role === 'admin' ? 'supervisor' : 'deudor';
                    window.state.view = 'dashboard';
                } catch (error) {
                    window.notify(error.message, 'error');
                    window.clearClientSession();
                    return;
                }
            }
            if (!result.user.must_change_password) await window.offerLegacyDataImport();
            window.updateUI();
            if (!result.user.must_change_password) window.fetchBCVRate();
        };

        window.handleAuthSubmit = async (event, kind) => {
            event.preventDefault();
            const form = event.target;
            const data = Object.fromEntries(new FormData(form).entries());
            const submit = form.querySelector('[type="submit"]');
            if (submit) { submit.disabled = true; submit.textContent = 'Procesando...'; }
            try {
                if (kind === 'login') {
                    const result = await window.apiRequest('/api/login', { method: 'POST', body: JSON.stringify(data) });
                    await window.finishAuthentication(result);
                } else if (kind === 'setup') {
                    const result = await window.apiRequest('/api/setup', { method: 'POST', body: JSON.stringify(data) });
                    await window.finishAuthentication(result);
                    window.notify('Cuenta administradora creada. Guarda tus credenciales de forma segura.', 'success');
                } else if (kind === 'changePassword') {
                    const result = await window.apiRequest('/api/change-password', { method: 'POST', body: JSON.stringify(data) });
                    await window.finishAuthentication(result);
                    window.notify('Contraseña actualizada.', 'success');
                }
            } catch (error) {
                window.notify(error.message, 'error');
                if (submit) { submit.disabled = false; submit.textContent = kind === 'login' ? 'Iniciar sesión' : kind === 'setup' ? 'Crear administrador' : 'Actualizar contraseña'; }
            }
        };

        window.logoutAccount = async () => {
            try {
                if (window.authUser) await window.apiRequest('/api/logout', { method: 'POST', body: '{}' });
            } catch (error) {
                if (error.status === 401) { window.clearClientSession(); return; }
                window.notify('No se pudo confirmar el cierre de sesión. Conéctate a internet y vuelve a intentarlo; la sesión del servidor podría seguir activa.', 'error');
                return;
            }
            window.clearClientSession();
        };

        window.showUsersManager = async () => {
            try {
                const result = await window.apiRequest('/api/users');
                window.usersCache = result.users;
                window.openModal('manageUsers');
            } catch (error) { window.notify(error.message, 'error'); }
        };
        window.exportFinancialBackup = async () => {
            try {
                const result = await window.apiRequest('/api/state');
                const backup = { app: 'Control Financiero', schema_version: 1, exported_at: new Date().toISOString(), data: result.data };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url; link.download = `respaldo-control-financiero-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
                window.notify('Respaldo descargado. Guárdalo en un lugar privado.', 'success');
            } catch (error) { window.notify(error.message, 'error'); }
        };
        window.handleImportBackup = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            if (!confirm('La importación solo se permite si la nube no tiene ingresos, presupuestos, gastos ni deudas. ¿Continuar?')) { event.target.value = ''; return; }
            try {
                const parsed = JSON.parse(await file.text());
                const data = parsed.data || parsed.state || parsed;
                const result = await window.apiRequest('/api/import-legacy', { method: 'POST', body: JSON.stringify({ data }) });
                window.cloudRevision = result.revision;
                window.cloudSnapshot = JSON.parse(JSON.stringify(result.data));
                window.applySharedData(result.data);
                window.updateUI();
                window.notify('Respaldo importado y sincronizado.', 'success');
            } catch (error) { window.notify(error.message || 'No se pudo leer el archivo JSON.', 'error'); }
            finally { event.target.value = ''; }
        };
        window.handleUserCreate = async (event) => {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(event.target).entries());
            try {
                const result = await window.apiRequest('/api/users', { method: 'POST', body: JSON.stringify(data) });
                const credential = result.temporary_password;
                window.notify('Cuenta creada. La contraseña temporal se mostrará una sola vez.', 'success');
                window.prompt('Entrega esta contraseña temporal al usuario por un canal seguro. Se le pedirá cambiarla al ingresar:', credential);
                const refreshed = await window.apiRequest('/api/users');
                window.usersCache = refreshed.users;
                window.updateUI();
            } catch (error) { window.notify(error.message, 'error'); }
        };
        window.resetUserPassword = async (id, username) => {
            if (!confirm(`¿Generar una contraseña temporal nueva para ${username}? Tendrá que cambiarla al ingresar.`)) return;
            try {
                const result = await window.apiRequest(`/api/users/${id}/reset-password`, { method: 'POST', body: '{}' });

        window.monthlyRecurringIncomeUSD = () => {
            const sources = window.state.incomeSources || [];
            if (!sources.length) return window.convertToUSD(Number(window.state.income?.amount) || 0, window.state.income?.currency || 'USD');
            return sources.reduce((sum, row) => {
                const amount = window.convertToUSD(Number(row.amount) || 0, row.currency);
                return sum + (row.frequency === 'quincenal' ? amount * 2 : row.frequency === 'mensual' ? amount : 0);
            }, 0);
        };

        window.calculateDebtPlan = () => {
            const settings = window.state.debtPlan || {};
            const income = window.monthlyRecurringIncomeUSD();
            const essentials = Math.max(0, Number(settings.monthlyEssentials) || 0);
            const cushion = Math.max(0, Number(settings.monthlyCushion) || 0);
            const safeCapacity = Math.max(0, income - essentials - cushion);
            const paymentPercent = Math.max(30, Math.min(85, Number(settings.paymentPercent) || 60));
            const debts = (window.state.debts || []).map(debt => {
                const balance = Math.max(0, window.convertToUSD(Number(debt.amount) - Number(debt.paid || 0), debt.currency));
                const minimum = Math.min(balance, Math.max(0, window.convertToUSD(Number(debt.minPayment) || 0, debt.currency)));
                const known = debt.interestKnown === true || (debt.interestKnown === undefined && Number(debt.interestRate) > 0);
                const rawRate = known ? Math.max(0, Number(debt.interestRate) || 0) / 100 : 0;
                const monthlyRate = !known ? 0 : (debt.interestPeriod === 'semanal' ? Math.pow(1 + rawRate, 52 / 12) - 1 : rawRate);
                return { ...debt, balance, minimum, monthlyRate, knownRate: known };
            }).filter(debt => debt.balance > 0.005);
            const missingMinimums = debts.filter(debt => debt.minimum <= 0.005);
            const missingRates = debts.filter(debt => !debt.knownRate);
            const minimumTotal = debts.reduce((sum, debt) => sum + debt.minimum, 0);
            const recommended = Math.min(safeCapacity, Math.max(minimumTotal, safeCapacity * paymentPercent / 100));
            const plan = {
                configured: settings.configured === true,
                income, essentials, cushion, safeCapacity, paymentPercent, debts,
                totalDebt: debts.reduce((sum, debt) => sum + debt.balance, 0),
                minimumTotal, missingMinimums, missingRates,
                recommendedPayment: recommended,
                flexibleAfterPayment: Math.max(0, safeCapacity - recommended),
                minimumsExceedCapacity: minimumTotal > safeCapacity + 0.01,
                projections: null,
                strategy: settings.strategy === 'snowball' ? 'snowball' : 'avalanche'
            };
            if (!plan.configured || !debts.length || missingMinimums.length || plan.minimumsExceedCapacity) return plan;

            let balances = debts.map(debt => ({ ...debt, balance: debt.balance }));
            let cumulativeInterest = 0;
            let cumulativePayments = 0;
            let months = 0;
            let firstMonthPayments = [];
            const prioritySort = (a, b) => plan.strategy === 'snowball'
                ? a.balance - b.balance
                : ((b.knownRate ? b.monthlyRate : -1) - (a.knownRate ? a.monthlyRate : -1)) || (a.balance - b.balance);

            while (balances.some(debt => debt.balance > 0.02) && months < 600) {
                months += 1;
                let interestThisMonth = 0;
                for (const debt of balances) {
                    const interest = debt.balance * debt.monthlyRate;
                    debt.balance += interest;
                    interestThisMonth += interest;
                    debt.paidThisMonth = 0;
                }
                cumulativeInterest += interestThisMonth;
                let budget = recommended;
                // Primero cubre mínimos para evitar que el cálculo priorice una deuda dejando otra sin cuota.
                for (const debt of balances) {
                    if (debt.balance <= 0.02 || debt.minimum <= 0) continue;
                    const payment = Math.min(debt.minimum, debt.balance, budget);
                    debt.balance -= payment; debt.paidThisMonth += payment; budget -= payment;
                    if (budget <= 0.005) break;
                }
                // El dinero restante se aplica según avalancha o bola de nieve.
                const sorted = balances.filter(debt => debt.balance > 0.02).sort(prioritySort);
                for (const debt of sorted) {
                    if (budget <= 0.005) break;
                    const payment = Math.min(debt.balance, budget);
                    debt.balance -= payment; debt.paidThisMonth += payment; budget -= payment;
                }
                const actual = balances.reduce((sum, debt) => sum + debt.paidThisMonth, 0);
                cumulativePayments += actual;
                if (months === 1) firstMonthPayments = balances.map(debt => ({ id: debt.id, entity: debt.entity, description: debt.description, currency: debt.currency, paymentUSD: debt.paidThisMonth, remainingUSD: debt.balance }));
                if (actual <= 0.005) break;
                // Si los intereses siguen creciendo por encima de la capacidad, evitamos una falsa promesa de liquidación.
                if (months > 12 && actual <= interestThisMonth + 0.005 && balances.some(debt => debt.balance > 0.02)) {
                    const progress = balances.reduce((sum, debt) => sum + debt.balance, 0);
                    if (progress >= plan.totalDebt) break;
                }
            }
            plan.projections = {
                months: balances.some(debt => debt.balance > 0.02) ? null : months,
                exceededHorizon: balances.some(debt => debt.balance > 0.02) && months >= 600,
                remainingAfterHorizon: balances.reduce((sum, debt) => sum + Math.max(0, debt.balance), 0),
                estimatedInterest: cumulativeInterest,
                estimatedTotalPaid: cumulativePayments,
                firstMonthPayments
            };
            return plan;
        };

                  <label class="block text-sm">Referencia<input name="reference" maxlength="120" class="w-full border rounded-xl p-3"></label>
                  <label class="block text-sm">Notas<input name="notes" maxlength="250" class="w-full border rounded-xl p-3"></label>
                  <button class="w-full bg-emerald-600 text-white rounded-xl p-3 font-bold">Guardar pago</button></form>`;
            } else if (window.state.modals.active === 'debtPlanSettings') {
                const plan = window.state.debtPlan || {};
                title = 'Configurar capacidad de pago';
                content = `<form onsubmit="window.handleFormSubmit(event,'debtPlanSettings')" class="space-y-4">
                    <p class="text-sm text-gray-600">Usa montos mensuales en USD. Incluye vivienda, comida, transporte, servicios, colegio, salud y otros compromisos esenciales. No incluyas aquí las cuotas de las deudas registradas: el planificador las suma aparte.</p>
                    <label class="block text-sm">Gastos esenciales mensuales (USD)<input name="monthlyEssentials" type="number" min="0" step="0.01" required value="${Number(plan.monthlyEssentials)||0}" class="mt-1 w-full border rounded-xl p-3"></label>
                    <label class="block text-sm">Reserva / colchón que no quieres tocar (USD)<input name="monthlyCushion" type="number" min="0" step="0.01" required value="${Number(plan.monthlyCushion)||0}" class="mt-1 w-full border rounded-xl p-3"></label>
                    <label class="block text-sm">Porcentaje del excedente destinado a deudas: <strong id="debtPercentValue">${Number(plan.paymentPercent)||60}%</strong><input name="paymentPercent" type="range" min="30" max="85" step="5" value="${Number(plan.paymentPercent)||60}" oninput="document.getElementById('debtPercentValue').textContent=this.value+'%'" class="mt-2 w-full"></label>
                    <p class="text-xs text-gray-500">Por defecto se destina el 60% del excedente protegido a las deudas y se deja el resto como margen flexible. Puedes moverlo de 30% a 85%.</p>
                    <label class="block text-sm">Estrategia<select name="strategy" class="mt-1 w-full border rounded-xl p-3 bg-white"><option value="avalanche" ${plan.strategy!=='snowball'?'selected':''}>Avalancha: mayor interés primero</option><option value="snowball" ${plan.strategy==='snowball'?'selected':''}>Bola de nieve: saldo menor primero</option></select></label>
                    <button type="submit" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Guardar capacidad</button></form>`;
            } else if (window.state.modals.active === 'editDebt') {
                if (window.state.role !== 'supervisor') return '';
                const debt = (window.state.debts||[]).find(x=>String(x.id)===String(window.state.modals.data));
                if (!debt) return '';
                title = 'Editar deuda';
                content = `<form onsubmit="window.handleFormSubmit(event,'editDebt')" class="space-y-3 max-h-[70vh] overflow-y-auto px-1 pb-4">
                  <input type="hidden" name="debtId" value="${window.escapeHTML(debt.id)}">
                  <label class="block text-sm">Tipo de deuda<select id="editDebtTypeSelect" name="type" required class="w-full border rounded-xl p-3 bg-white"><option value="tdc" ${debt.type==='tdc'?'selected':''}>Tarjeta de crédito</option><option value="cashea" ${debt.type==='cashea'?'selected':''}>Cashea / App de crédito</option><option value="prestamo" ${debt.type==='prestamo'?'selected':''}>Préstamo</option><option value="otro" ${debt.type==='otro'?'selected':''}>Otra deuda</option></select></label>
                  <div class="grid grid-cols-2 gap-3"><label class="block text-sm">Monto original<input name="amount" type="number" min="${Number(debt.paid)||0}" step="0.01" required value="${Number(debt.amount)||0}" class="w-full border rounded-xl p-3"></label><label class="block text-sm">Moneda<select name="currency" class="w-full border rounded-xl p-3 bg-white"><option value="USD" ${debt.currency!=='BS'?'selected':''}>USD</option><option value="BS" ${debt.currency==='BS'?'selected':''}>Bs / VES</option></select></label></div>
                  <label class="block text-sm">Banco, comercio o acreedor<input name="entity" maxlength="120" required value="${window.escapeHTML(debt.entity||'')}" class="w-full border rounded-xl p-3"></label>
                  <label class="block text-sm">Descripción<input name="description" maxlength="250" required value="${window.escapeHTML(debt.description||'')}" class="w-full border rounded-xl p-3"></label>
                  <div class="rounded-xl border bg-purple-50 p-3 space-y-3"><strong class="text-sm text-purple-800">Tarjeta / pago mínimo</strong><label class="block text-sm">Pago mínimo<input name="minPayment" type="number" min="0" step="0.01" value="${Number(debt.minPayment)||0}" class="w-full border rounded-xl p-3 bg-white"></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm">Día de corte<input name="cutDate" type="number" min="1" max="31" value="${window.escapeHTML(debt.cutDate||'')}" class="w-full border rounded-xl p-3 bg-white"></label><label class="block text-sm">Pagar antes de<input name="payBefore" type="date" value="${window.escapeHTML(debt.payBefore||'')}" class="w-full border rounded-xl p-3 bg-white"></label></div></div>
                  <label class="block text-sm">Cuotas (si aplica)<input name="installments" type="number" min="0" step="1" value="${Number(debt.installments)||0}" class="w-full border rounded-xl p-3"></label>
                  <label class="block text-sm">Número de factura<input name="invoice" maxlength="100" value="${window.escapeHTML(debt.invoice||'')}" class="w-full border rounded-xl p-3"></label>
                  <div class="grid grid-cols-2 gap-3"><label class="block text-sm">Interés (%)<input name="interestRate" type="number" min="0" max="10000" step="0.01" value="${Number(debt.interestRate)||0}" class="w-full border rounded-xl p-3"></label><label class="block text-sm">Período<select name="interestPeriod" class="w-full border rounded-xl p-3 bg-white"><option value="mensual" ${debt.interestPeriod!=='semanal'?'selected':''}>Mensual</option><option value="semanal" ${debt.interestPeriod==='semanal'?'selected':''}>Semanal</option></select></label></div>
                  <label class="flex items-center gap-2 text-sm"><input name="interestKnown" type="checkbox" value="yes" ${debt.interestKnown?'checked':''}> Tasa confirmada</label>
                  <p class="text-xs text-amber-800 bg-amber-50 p-2 rounded-lg">Pagado hasta ahora: ${window.formatMoney(Number(debt.paid)||0,debt.currency)}. El monto original no puede quedar por debajo de lo ya pagado; los abonos registrados se conservan.</p>
                  <button class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Guardar cambios de deuda</button></form>`;
            } else if (window.state.modals.active === 'editDebtTerms') {
                const debt = (window.state.debts||[]).find(x=>String(x.id)===String(window.state.modals.data));
                if (!debt) return '';
                title = 'Condiciones para el plan de pagos';
                content = `<form onsubmit="window.handleFormSubmit(event,'editDebtTerms')" class="space-y-4"><input type="hidden" name="debtId" value="${window.escapeHTML(debt.id)}">
                    <p class="text-sm text-gray-600">${window.escapeHTML(debt.entity)} · ${window.escapeHTML(debt.description)}. Montos de cuotas en ${debt.currency}.</p>
                    <label class="block text-sm">Cuota mínima/obligatoria mensual<input name="minPayment" type="number" min="0" step="0.01" required value="${Number(debt.minPayment)||0}" class="mt-1 w-full border rounded-xl p-3"></label>
                    <label class="block text-sm">Tasa por período (%)<input name="interestRate" type="number" min="0" max="10000" step="0.01" value="${Number(debt.interestRate)||0}" class="mt-1 w-full border rounded-xl p-3"></label>
                    <label class="block text-sm">Período<select name="interestPeriod" class="mt-1 w-full border rounded-xl p-3 bg-white"><option value="mensual" ${debt.interestPeriod!=='semanal'?'selected':''}>Mensual</option><option value="semanal" ${debt.interestPeriod==='semanal'?'selected':''}>Semanal</option></select></label>
                    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="interestKnown" value="yes" ${debt.interestKnown || Number(debt.interestRate||0)>0?'checked':''}> Conozco la tasa exacta por período</label>
                    <p class="text-xs text-amber-700 bg-amber-50 rounded-lg p-2">Si no conoces la tasa, no marques la casilla. La proyección excluirá esos intereses y lo avisará.</p>
                    <button type="submit" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Guardar condiciones</button></form>`;
            }
            return `
                <div class="fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-end md:items-center justify-center fade-in backdrop-blur-sm overflow-y-auto">
                    <div class="bg-white w-full md:w-[450px] rounded-t-3xl md:rounded-3xl p-6 shadow-2xl relative pb-8 md:pb-6 max-h-[90vh] overflow-y-auto">
                        <button onclick="window.closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700 text-xl"><i class="fas fa-times"></i></button>
                        <h3 class="text-xl font-bold text-gray-800 mb-5 shrink-0">${title}</h3>
                        ${content}
                    </div>
                </div>
            `;
        };

        window.updateDebtPaymentAmount = (debtId) => {
            const debt = (window.state.debts || []).find(d => d.id === debtId);
            const choice = document.getElementById('cardPaymentChoice')?.value;
            const amountInput = document.getElementById('debtPaymentAmount');
            if (!debt || !amountInput) return;
            const remaining = Math.max(0, Number(debt.amount || 0) - Number(debt.paid || 0));
            if (choice === 'minimum') amountInput.value = Math.min(Number(debt.minPayment || 0), remaining).toFixed(2);
            else if (choice === 'total') amountInput.value = remaining.toFixed(2);
            else amountInput.value = '';
        };

        window.handleFormSubmit = (e, type) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const uniqueId = Date.now().toString(); // Generar ID único local

            if (type === 'expense') {
                window.state.expenses.unshift({ // Añadir al principio
                    id: uniqueId,
                    amount: parseFloat(data.amount),
                    currency: data.currency,
                    category: data.category,
                    description: data.description,
                    method: data.method,
                    bank: data.bank,
                    date: new Date().toISOString()
                });
            } 
            else if (type === 'debt') {
                window.state.debts.unshift({
                    id: uniqueId,
                    type: data.type,
                    amount: parseFloat(data.amount),
                    currency: data.currency,
                    entity: data.entity,
                    description: data.description,
                    paid: 0,
                    date: new Date().toISOString(),
                    minPayment: data.minPayment ? parseFloat(data.minPayment) : null,
                    cutDate: data.cutDate || null,
                    payBefore: data.payBefore || null,
                    installments: data.installments ? parseInt(data.installments) : null,
                    invoice: data.invoice || null,
                    interestRate: data.interestRate ? parseFloat(data.interestRate) : 0,
                    interestPeriod: data.interestPeriod || 'mensual',
                    interestKnown: data.interestKnown === 'yes'
                });
            } 
            else if (type === 'editDebt') {
                if (window.state.role !== 'supervisor') { window.showToast('Solo el administrador puede editar deudas.', 'error'); return; }
                const debt = (window.state.debts||[]).find(row => String(row.id) === String(data.debtId));
                if (debt) {
                    const amount = Number(data.amount);
                    if (!Number.isFinite(amount) || amount < Number(debt.paid||0)) { window.showToast('El monto original no puede ser menor que lo ya pagado.', 'error'); return; }
                    debt.type = ['tdc','cashea','prestamo','otro'].includes(data.type) ? data.type : 'otro';
                    debt.amount = amount;
                    debt.currency = data.currency === 'BS' ? 'BS' : 'USD';
                    debt.entity = String(data.entity||'').trim();
                    debt.description = String(data.description||'').trim();
                    debt.minPayment = Math.max(0, Number(data.minPayment)||0);
                    debt.cutDate = data.cutDate || null;
                    debt.payBefore = data.payBefore || null;
                    debt.installments = Math.max(0, parseInt(data.installments||'0',10)||0);
                    debt.invoice = String(data.invoice||'').trim();
                    debt.interestRate = Math.max(0, Number(data.interestRate)||0);
                    debt.interestPeriod = data.interestPeriod === 'semanal' ? 'semanal' : 'mensual';
                    debt.interestKnown = data.interestKnown === 'yes';
                }
            }
            else if (type === 'payDebt') {
                const debt = window.state.debts.find(d => d.id === data.debtId);
                if (debt) {
                    const isScheduled = debt.type !== 'tdc' && data.scheduleType && data.scheduleType !== 'now';
                    if (isScheduled) {
                        window.state.plannedDebtPayments = window.state.plannedDebtPayments || [];
                        const scheduledDate = data.scheduleType === 'date' ? data.scheduledDate : '';
                        window.state.plannedDebtPayments.unshift({
                            id: uniqueId, debtId: debt.id, entity: debt.entity, description: debt.description,
                            amount: parseFloat(data.amount), currency: debt.currency,
                            scheduleType: data.scheduleType, scheduledDate,
                            status: 'planned', createdAt: new Date().toISOString()
                        });
                    } else {
                        const paymentAmount = parseFloat(data.amount);
                        debt.paid = (debt.paid || 0) + paymentAmount;
                        if (debt.type === 'tdc') {
                            debt.lastMinimumPaymentDate = new Date().toISOString().slice(0,10);
                            debt.minimumPaidThisCycle = data.paymentChoice === 'minimum' || paymentAmount >= Number(debt.minPayment || 0);
                            debt.lastPaymentChoice = data.paymentChoice || 'custom';
                        }
                        window.state.expenses.unshift({
                            id: uniqueId + '_payment', amount: paymentAmount, currency: debt.currency,
                            category: 'fijo', description: `Abono/Pago Deuda: ${debt.entity}`,
                            method: 'banco', date: new Date().toISOString()
                        });
                    }
                }
            } 

            else if (type === 'incomeSource') {
                const frequency = data.frequency;
                window.state.incomeSources = window.state.incomeSources || [];
                window.state.incomeSources.unshift({id:uniqueId,kind:data.kind,name:data.name||'',amount:parseFloat(data.amount),currency:data.currency,frequency,payDays:frequency==='quincenal'?[Number(data.day1)||15,Number(data.day2)||30]:frequency==='mensual'?[Number(data.day1)||30]:[]});
            }
            else if (type === 'editIncomeSource') {
                if (window.state.role !== 'supervisor') { window.showToast('Solo el administrador puede editar ingresos.', 'error'); return; }
                const row = (window.state.incomeSources||[]).find(item => String(item.id) === String(data.incomeId));
                if (row) {
                    const amount = Number(data.amount);
                    if (!Number.isFinite(amount) || amount <= 0) { window.showToast('Introduce un monto válido mayor que cero.', 'error'); return; }
                    const frequency = ['quincenal','mensual','ocasional'].includes(data.frequency) ? data.frequency : 'quincenal';
                    row.kind = ['sueldo','bono','cestatickets','otro'].includes(data.kind) ? data.kind : 'otro';
                    row.name = String(data.name||'').trim();
                    row.amount = amount;
                    row.currency = data.currency === 'BS' ? 'BS' : 'USD';
                    row.frequency = frequency;
                    row.payDays = frequency === 'quincenal' ? [Number(data.day1)||15, Number(data.day2)||30] : frequency === 'mensual' ? [Number(data.day1)||30] : [];
                }
            }
            else if (type === 'schoolExpense') {
                window.state.schoolExpenses = window.state.schoolExpenses || [];
                window.state.schoolExpenses.unshift({id:uniqueId,student:data.student||'',concept:data.concept,description:data.description,amount:parseFloat(data.amount),currency:data.currency,date:data.date||new Date().toISOString().slice(0,10),dueDate:data.dueDate||'',notes:data.notes||''});
            }
            else if (type === 'schoolPayment') {
                const school = (window.state.schoolExpenses||[]).find(x=>String(x.id)===String(data.expenseId));
                if (school) {
                    const existing = (window.state.schoolPayments||[]).filter(x=>String(x.expenseId)===String(data.expenseId)).reduce((n,x)=>n+window.convertToUSD(x.amount,x.currency),0);
                    const paymentUSD = window.convertToUSD(parseFloat(data.amount),data.currency);
                    const balanceUSD = window.convertToUSD(school.amount,school.currency)-existing;
                    if (paymentUSD > balanceUSD + 0.01) { window.showToast('El pago supera el saldo pendiente. Reduce el monto.', 'error'); return; }
                    window.state.schoolPayments = window.state.schoolPayments || [];
                    window.state.schoolPayments.unshift({id:uniqueId,expenseId:data.expenseId,amount:parseFloat(data.amount),currency:data.currency,date:data.date||new Date().toISOString().slice(0,10),method:data.method,reference:data.reference||'',notes:data.notes||''});
                    window.state.expenses.unshift({id:uniqueId+'_school',amount:parseFloat(data.amount),currency:data.currency,category:'fijo',description:'Pago colegio: '+school.description,method:data.method==='efectivo'?'efectivo':data.method==='pago_movil'?'pago_movil':'banco',bank:data.reference||'Colegio',date:new Date().toISOString()});
                }
            }
            else if (type === 'debtPlanSettings') {
                window.state.debtPlan = {
                    monthlyEssentials: Math.max(0, Number(data.monthlyEssentials) || 0),
                    monthlyCushion: Math.max(0, Number(data.monthlyCushion) || 0),
                    paymentPercent: Math.max(30, Math.min(85, Number(data.paymentPercent) || 60)),
                    strategy: data.strategy === 'snowball' ? 'snowball' : 'avalanche',
                    configured: true
                };
            }
            else if (type === 'editDebtTerms') {
                const debt = (window.state.debts||[]).find(row => String(row.id) === String(data.debtId));
                if (debt) {
                    debt.minPayment = Math.max(0, Number(data.minPayment) || 0);
                    debt.interestRate = Math.max(0, Number(data.interestRate) || 0);
                    debt.interestPeriod = data.interestPeriod === 'semanal' ? 'semanal' : 'mensual';
                    debt.interestKnown = data.interestKnown === 'yes';
                }
            }
            else if (type === 'income') {
                window.state.income = { amount: parseFloat(data.amount), currency: data.currency };
            } 
            else if (type === 'budgets') {
                window.state.budgets = {
                    comida: parseFloat(data.comida) || 0,
                    transporte: parseFloat(data.transporte) || 0,
                    fijo: parseFloat(data.fijo) || 0,
                    hormiga: parseFloat(data.hormiga) || 0
                };
            }

            window.closeModal(); // SaveState se llama al cerrar el modal internamente en otras ramas, pero lo aseguramos aquí:
            window.saveState();
        };

        window.deleteDocHandler = (collectionName, docId) => {
            if(confirm("¿Estás seguro de eliminar este registro permanentemente?")) {
                window.state[collectionName] = window.state[collectionName].filter(item => item.id !== docId);
                window.saveState();
            }
        };

        // --- INIT ---
        window.onload = async () => {
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            try {
                const status = await fetch('/api/status', { credentials: 'same-origin' });
                const info = await status.json();
                window.setupRequired = !!info.setup_required;
                window.csrfToken = info.csrf_token || null;
                if (info.authenticated && info.user) {
                    window.authUser = info.user;
                    window.state.role = info.user.role === 'admin' ? 'supervisor' : 'deudor';
                    window.state.view = 'dashboard';
                    if (!info.user.must_change_password) {
                        try { await window.refreshSharedState(); }
                        catch (error) { window.notify(error.message, 'error'); window.clearClientSession(); }
                        window.state.role = info.user.role === 'admin' ? 'supervisor' : 'deudor';
                        window.state.view = 'dashboard';
                    }
                }
                if (window.authUser && !window.authUser.must_change_password) await window.offerLegacyDataImport();
                window.updateUI();
                if (window.authUser && !window.authUser.must_change_password) window.fetchBCVRate();
            } catch (error) {
                window.setupRequired = false;
                window.authUser = null;
                window.updateUI();
                window.notify('No se puede conectar al servidor. Conéctate a internet para iniciar sesión y sincronizar tus datos.', 'error');
            }
        };
        window.addEventListener('online', () => window.syncSharedState());

    </script>
    
    <div id="app-root" class="h-full w-full">
        <!-- Loader inicial rápido -->
        <div class="flex flex-col items-center justify-center h-full bg-slate-900">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-blue-300 font-medium">Iniciando sistema local...</p>
        </div>
    </div>
</body>
</html>
