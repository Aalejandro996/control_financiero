<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6B4D">
<title>{{CODIGO}} · {{TITULO}} · Quincena VE</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#F3F6F2;--ink:#12211B;--mut:#46564E;--g:#0B6B4D;--gs:#E3F1EA;--line:#D5DDD7;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--ink:#EAF1EC;--mut:#A9B8AF;--g:#4FC79C;--gs:#173226;--line:#2A3A32;--card:#16211C}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 90% -10%,var(--gs),transparent 60%),var(--bg);color:var(--ink);font-family:Figtree,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:20px 24px}header a{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:800;font-size:1.2rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{position:relative;overflow:hidden;max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 32px;box-shadow:0 18px 50px rgba(11,107,77,.12)}
.num{position:absolute;right:-8px;top:-30px;font-size:9rem;font-weight:800;letter-spacing:-.06em;color:var(--gs);line-height:1;pointer-events:none}
.chip{position:relative;display:inline-block;padding:5px 12px;border-radius:999px;background:var(--gs);color:var(--g);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
h1{position:relative;font-size:1.9rem;margin:14px 0 8px;letter-spacing:-.02em}
p{position:relative;color:var(--mut);margin:0 0 10px;line-height:1.5}
.ref{background:var(--gs);border-radius:12px;padding:10px 14px;color:var(--ink)}.ref code{color:var(--g);font-weight:800;letter-spacing:.08em}
.acc{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;background:var(--g);color:#fff;border:2px solid var(--g)}
.btn.w{background:transparent;color:var(--g)}
footer{padding:16px 24px;color:var(--mut);font-size:.85rem;text-align:center}footer a{color:var(--mut);margin:0 6px}
</style>
</head>
<body>
<header><a href="/"><img src="/static/icons/icon.svg" alt="" width="32" height="32">Quincena VE</a></header>
<main>
  <div class="card">
    <div class="num" aria-hidden="true">{{CODIGO}}</div>
    <span class="chip">Error {{CODIGO}}</span>
    <h1>{{TITULO}}</h1>
    <p>{{MENSAJE}}</p>
    <p>{{CONSEJO}}</p>
    {{REF}}
    <div class="acc"><a class="btn" href="/">Ir al inicio</a><a class="btn w" href="/app">Abrir la app</a></div>
  </div>
</main>
<footer>Quincena VE · un producto de Gigadevs Corp<br><a href="/terminos">Términos</a><a href="/privacidad">Privacidad</a><a href="/cookies">Cookies</a></footer>
</body>
</html>
