# Compila el APK firmado cada vez que cambias algo dentro de android/ y lo publica en downloads/.
# Ese commit hace que Render despliegue, y la app instalada avisa: "Nueva versión disponible".
name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**"]
  workflow_dispatch: {}   # también puedes lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que todo esté listo
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ok=1
          [ -f android/gradlew ] || { echo "::error::No encuentro android/gradlew. Sube la carpeta android al repositorio (git add android)."; ok=0; }
          [ -f android/app/build.gradle.kts ] || { echo "::error::No encuentro android/app/build.gradle.kts dentro del repositorio."; ok=0; }
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] || { echo "::error::Falta android/gradle/wrapper/gradle-wrapper.jar. Revisa que tu .gitignore no ignore *.jar y súbelo."; ok=0; }
          [ -n "$KS" ] || { echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64."; ok=0; }
          [ -n "$KP" ] || { echo "::error::Falta el secreto ANDROID_KEYSTORE_PASSWORD."; ok=0; }
          [ -n "$KA" ] || { echo "::error::Falta el secreto ANDROID_KEY_ALIAS."; ok=0; }
          [ -n "$KK" ] || { echo "::error::Falta el secreto ANDROID_KEY_PASSWORD."; ok=0; }
          [ "$ok" = 1 ] && echo "Todo listo para compilar." || exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Preparar la llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/quincena.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 no es válido. Vuelve a copiarlo con: base64 -i quincena.jks | pbcopy"; exit 1; }

      - name: Compilar APK firmado
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/quincena.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="1.$((4 + GITHUB_RUN_NUMBER))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar en downloads/ (Render lo despliega solo)
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/quincena.apk
          NOTES=$(git log -1 --pretty=%s | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()[:200]))')
          printf '{"versionCode": %s, "versionName": "%s", "notes": %s}\n' "$VERSION_CODE" "$VERSION_NAME" "$NOTES" > downloads/version.json
          git config user.name "quincena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/quincena.apk downloads/version.json
          git commit -m "APK $VERSION_NAME"
          git pull --rebase
          git push